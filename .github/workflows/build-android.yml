name: Build Android APK

on:
  workflow_dispatch:

jobs:
  android:
    name: Android APK (debug signed)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept SDK licenses & install NDK
        run: |
          export ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "ndk;26.3.11579264" > /dev/null 2>&1
          NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
          ls "$NDK_PATH" > /dev/null && echo "NDK 就绪"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@latest

      - name: Init & build debug APK
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: writer-android-debug
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
