name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src-tauri/**'
      - 'resources/**'
      - '.github/workflows/build-android.yml'

jobs:
  android:
    name: Android APK (stable signature)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept SDK licenses & install NDK
        run: |
          export ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "ndk;26.3.11579264" > /dev/null 2>&1
          NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
          ls "$NDK_PATH" > /dev/null && echo "NDK 就绪"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@latest

      - name: Init Android project
        run: npx tauri android init --ci

      - name: Patch Android (status bar / back key / icon / name)
        run: |
          python3 resources/patch-android.py
          echo "--- 补丁后片段 ---"
          grep -rn -A3 "moyu-safe-area begin" src-tauri/gen/android/app/src/main/ || true

      - name: Build release APK
        run: npx tauri android build --apk

      - name: Sign APK with stable keystore
        run: |
          set -e
          export ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret，无法使用固定签名"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | grep -v -i "debugSymbols" | head -1)
          echo "原始包: $APK"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | tail -1)
          "$APKSIGNER" sign --ks release.jks \
            --ks-pass "pass:${{ secrets.ANDROID_KS_PASS }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASS }}" \
            --min-sdk-version 24 \
            --out writer-signed.apk "$APK"
          echo "--- 签名证书 ---"
          "$APKSIGNER" verify --print-certs writer-signed.apk | head -6
          ls -lh writer-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: writer-android-signed
          path: writer-signed.apk
          retention-days: 30
