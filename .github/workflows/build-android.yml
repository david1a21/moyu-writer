name: Build Android APK

on:
  workflow_dispatch:

jobs:
  android:
    name: Android APK (self-signed, installable)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept SDK licenses & install NDK
        run: |
          export ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "ndk;26.3.11579264" > /dev/null 2>&1
          NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
          ls "$NDK_PATH" > /dev/null && echo "NDK 就绪"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@latest

      - name: Init Android project
        run: npx tauri android init --ci

      - name: Patch MainActivity safe-area insets
        run: |
          python3 resources/patch-android.py
          echo "--- 补丁后片段 ---"
          grep -n -A6 "moyu-safe-area begin" src-tauri/gen/android/app/src/main/java/com/inkwell/moyu/MainActivity.kt

      - name: Build release APK
        run: npx tauri android build --apk

      - name: Self-sign APK
        run: |
          set -e
          export ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          keytool -genkeypair -v -keystore writer.keystore -alias writer \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass writer123 -keypass writer123 \
            -dname "CN=Writer, OU=Personal, O=Writer, L=Qingyuan, C=CN"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | grep -v -i "debugSymbols" | head -1)
          echo "原始包: $APK"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" sign --ks writer.keystore --ks-pass pass:writer123 \
            --key-pass pass:writer123 --min-sdk-version 24 \
            --out writer-signed.apk "$APK"
          "$APKSIGNER" verify --print-certs writer-signed.apk | head -5
          ls -lh writer-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: writer-android-signed
          path: writer-signed.apk
          retention-days: 30
