name: Build Tauri All Platforms

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            artifact: windows
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            artifact: macos
          - platform: ubuntu-22.04
            args: ''
            artifact: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf libssl-dev build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@latest

      - name: Build bundle
        run: npx tauri build ${{ matrix.args }}
        env:
          # 不签名，避免 CI 里寻找证书
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          TAURI_SIGNING_PRIVATE_KEY: ''

      - uses: actions/upload-artifact@v4
        with:
          name: writer-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 30

  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept SDK licenses & install NDK
        run: |
          export ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "使用 sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "ndk;26.3.11579264" > /dev/null 2>&1
          NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
          ls "$NDK_PATH" > /dev/null && echo "NDK 就绪: $NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@latest

      - name: Init & build Android
        run: |
          npx tauri android init --ci
          npx tauri android build --apk

      - uses: actions/upload-artifact@v4
        with:
          name: writer-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@latest

      - name: Init iOS project
        run: npx tauri ios init --ci

      - name: Build unsigned app
        run: |
          cd src-tauri/gen/apple
          echo "生成目录内容："; ls -la
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME=$(basename "$PROJ" .xcodeproj)
          echo "工程: $PROJ  方案: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - uses: actions/upload-artifact@v4
        with:
          name: writer-ios-unsigned
          path: src-tauri/gen/apple/build/Build/Products/Release-iphoneos/*.app
          retention-days: 30
