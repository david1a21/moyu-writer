name: Build iOS App (m14)

on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS unsigned app on macos-14
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@latest

      - name: Init iOS project
        run: npx tauri ios init --ci

      - name: Build unsigned app
        run: |
          set -e
          cd src-tauri/gen/apple
          ls -la
          PROJ=$(ls -d *.xcodeproj | head -1)
          echo "工程: $PROJ"
          xcodebuild -list -project "$PROJ" || true
          SCHEME=$(xcodebuild -list -project "$PROJ" 2>/dev/null \
            | awk '/Schemes:/{f=1;next} f&&NF{gsub(/^[ \t]+|[ \t]+$/,"");print;exit}')
          echo "选用 scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package app bundle
        run: |
          cd src-tauri/gen/apple
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "产物: $APP"
          zip -qry ../Inkwell-iOS-unsigned.zip "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: writer-ios-unsigned
          path: src-tauri/gen/apple/Inkwell-iOS-unsigned.zip
          retention-days: 30
