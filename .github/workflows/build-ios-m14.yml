name: Build iOS App (m14)

on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS unsigned app on macos-14
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@latest

      - name: Init iOS project
        run: npx tauri ios init --ci

      - name: Build unsigned app
        run: |
          set -e
          npx tauri ios build --help || true
          npx tauri ios build --no-sign

      - name: Package ipa
        run: |
          set -e
          cd src-tauri/gen/apple
          APP=$(find . -name "*.app" -maxdepth 6 | head -1)
          echo "app: $APP"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa && zip -qry ../../Inkwell-iOS-unsigned.ipa Payload
          echo "--- ipa 结构 ---"
          unzip -l ../Inkwell-iOS-unsigned.ipa | head -12

      - uses: actions/upload-artifact@v4
        with:
          name: writer-ios-unsigned
          path: src-tauri/gen/apple/Inkwell-iOS-unsigned.ipa
          retention-days: 30
