name: Build iOS App (m14)

on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS unsigned app on macos-14
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@latest

      - name: Init iOS project
        run: npx tauri ios init --ci

      - name: Build unsigned app
        run: |
          set -e
          npx tauri ios build --help || true
          npx tauri ios build --no-sign

      - name: Package ipa
        run: |
          set -e
          cd src-tauri/gen/apple
          APP=$(find . -name "*.app" -maxdepth 6 | head -1)
          OUT="$PWD/Inkwell-iOS-unsigned.ipa"
          echo "app: $APP"
          BUILT=$(find . -name "*.ipa" -maxdepth 5 | head -1)
          echo "CLI 产物: ${BUILT:-无}"
          if [ -n "$BUILT" ]; then
            cp "$BUILT" "$OUT"
            echo "使用 CLI 生成的 ipa"
          else
            rm -rf ipa && mkdir -p ipa/Payload
            cp -R "$APP" ipa/Payload/
            ( cd ipa && zip -qry "$OUT" Payload )
            echo "自行封装 Payload 结构"
          fi
          echo "--- ipa 结构 ---"
          unzip -l "$OUT" | head -12
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: writer-ios-unsigned
          path: src-tauri/gen/apple/Inkwell-iOS-unsigned.ipa
          retention-days: 30
