body.ruled-view .toast-stack{bottom:78px}
body.focus.ruled-view .focus-fab{display:none}
body.focus.ruled-view .side,body.focus.ruled-view .inspector{display:none}

/* ============ 第二批 · 设定高亮 / 文饰 / 纸纹 / 指令 ============ */
.hl-mirror{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;
  font-family:var(--edit-font);font-size:var(--edit-size);font-weight:var(--ink-weight,400);
  line-height:var(--rule-h,39px);letter-spacing:normal;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;
  padding:0 0 0 4px;color:transparent;-webkit-text-fill-color:transparent}
.hl-inner{will-change:transform;min-height:100%}
.hl-mirror mark{color:transparent;-webkit-text-fill-color:transparent;
  border-radius:4px;padding:1px 0;background:var(--hl-c)}
.hl-mirror mark.hl-char{--hl-c:rgba(168,140,255,.20)}
.hl-mirror mark.hl-word{--hl-c:rgba(255,175,110,.20)}
.hl-mirror mark.hl-dialog{--hl-c:rgba(95,211,166,.15)}
.hl-mirror mark.hl-punct{--hl-c:rgba(124,139,255,.13)}
body.hl-underline .hl-mirror mark.hl-char{box-shadow:inset 0 -2px 0 rgba(168,140,255,.65)}
body.hl-underline .hl-mirror mark.hl-word{box-shadow:inset 0 -2px 0 rgba(255,175,110,.65)}
body.no-hl .hl-mirror{display:none}
.paper-bg{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-position:center;background-size:cover;background-repeat:no-repeat;
  opacity:var(--ink-bg-opacity,.16);transition:opacity .4s;
  -webkit-mask-image:radial-gradient(ellipse at 50% 42%,#000 52%,transparent 100%);
  mask-image:radial-gradient(ellipse at 50% 42%,#000 52%,transparent 100%);
  filter:saturate(.82)}
.editor-col.ruled .paper-scroll,.editor-col.ruled .paper,
.editor-col.ruled #editorText{position:relative}
.editor-col.ruled #editorText{z-index:2;background-color:transparent}
.editor-col.ruled .rd-tools,.editor-col.ruled .rd-status,
.editor-col.ruled .rd-title-wrap,.editor-col.ruled .rd-bar{z-index:5}

/* 文饰工具条 */
.mark-tools{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:10px}
.mark-tool{height:42px;border-radius:13px;background:var(--surface2);border:1px solid var(--line);
  color:var(--text2);font-size:13px;font-weight:700;display:grid;place-items:center;
  transition:.28s var(--ease);position:relative}
.mark-tool:hover{color:var(--brand);border-color:var(--brand);transform:translateY(-3px);box-shadow:var(--shadow2)}
.mark-tool:active{transform:scale(.92)}
.mark-tool small{position:absolute;bottom:3px;font-size:8px;font-weight:400;color:var(--muted)}
.mark-tool b{font-size:14px;margin-top:-4px}
.mark-tool.strike b{text-decoration:line-through}
.mark-tool.hl b{background:color-mix(in srgb,var(--mark-accent,#7C8BFF) 35%,transparent);
  padding:1px 5px;border-radius:5px;color:var(--text)}
.mark-rows{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.mark-row-btn{padding:10px 4px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);
  font-size:11px;color:var(--text2);transition:.26s var(--ease);text-align:center}
.mark-row-btn:hover{color:var(--brand);border-color:var(--brand);transform:translateY(-2px)}
.mark-row-btn b{display:block;font-size:13px;margin-bottom:3px}
.mark-sw{width:26px;height:26px;border-radius:9px;border:1px solid var(--line);transition:.25s}
.mark-sw:hover{transform:scale(1.12)}
.mark-sw.on{box-shadow:0 0 0 2px var(--surface3),0 0 0 4px var(--brand)}
.ink-word-row{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:13px;
  background:var(--surface2);margin-bottom:7px;font-size:12px}
.ink-word-row .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ink-word-row .x{color:var(--muted);padding:2px 5px;border-radius:6px}
.ink-word-row .x:hover{color:#EF6A6A;background:var(--surface3)}
.ink-duo{display:flex;gap:7px}
.ink-duo input{flex:1;min-width:0;height:36px;border:1px solid var(--line);background:var(--surface2);
  border-radius:12px;padding:0 11px;outline:none;font-size:12px;color:var(--text)}
.ink-duo input:focus{border-color:var(--brand)}
.tex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tex-pick{border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);
  overflow:hidden;transition:.3s var(--ease)}
.tex-pick:hover{transform:translateY(-3px)}
.tex-pick.on{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 12%,transparent)}
.tex-pick .prev{height:42px;background:var(--surface3);position:relative;overflow:hidden}
.tex-pick .prev i{position:absolute;inset:0}
.tex-pick span{display:block;padding:7px 3px;font-size:10.5px;color:var(--text2)}
.bg-drop{border:1.5px dashed var(--line);border-radius:18px;min-height:100px;
  display:grid;place-items:center;position:relative;overflow:hidden;transition:.3s var(--ease);
  background:var(--surface2);cursor:pointer;text-align:center;padding:14px}
.bg-drop:hover{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 6%,var(--surface2))}
.bg-drop.has{background-size:cover;background-position:center;border-style:solid}
.bg-drop .ph{font-size:11px;color:var(--muted);line-height:1.9;position:relative;z-index:2}
.bg-drop .ph b{display:block;color:var(--text2);font-size:12px;margin-bottom:3px}
.bg-drop.has .ph{background:rgba(10,13,26,.5);padding:7px 12px;border-radius:12px;color:#fff}
.bg-acts{display:flex;gap:7px;margin-top:9px}
.mo-tag{font-size:9px;padding:2px 6px;border-radius:6px;background:var(--surface2);
  color:var(--muted);letter-spacing:.04em}

/* 文饰阅读预览 */
.rich-body{max-height:58vh;overflow:auto;font-family:var(--edit-font);color:var(--text);
  padding:4px 6px 8px;font-size:17px;line-height:2.05}
.rich-body h2,.rich-body h3,.rich-body h4{margin:20px 0 10px;line-height:1.5;letter-spacing:.03em}
.rich-body h2{font-size:22px;border-left:3px solid var(--brand);padding-left:12px}
.rich-body h3{font-size:19px;color:var(--brand)}
.rich-body h4{font-size:17px;color:var(--text2)}
.rich-body p{margin:0 0 1em;text-indent:2em}
.rich-body blockquote{margin:12px 0;padding:10px 16px;border-left:3px solid var(--accent);
  background:var(--surface2);border-radius:0 14px 14px 0;color:var(--text2)}
.rich-body blockquote p{text-indent:0;margin:0}
.rich-body ul,.rich-body ol{margin:8px 0 14px;padding-left:26px}
.rich-body li{margin:4px 0}
.rich-body .task{list-style:none;margin-left:-20px}
.rich-body .task input{accent-color:var(--brand);margin-right:8px}
.rich-body hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.rich-body mark{background:color-mix(in srgb,var(--mark-accent,#7C8BFF) 32%,transparent);
  color:var(--text);padding:1px 3px;border-radius:4px}
.rich-body del{opacity:.55}
.rich-body strong{font-weight:700;color:var(--text)}
.rich-body em{font-style:italic;color:var(--text2)}
@media(max-width:520px){
  .mark-tools{grid-template-columns:repeat(4,1fr)}
  .mark-rows{grid-template-columns:repeat(2,1fr)}
  .tex-grid{grid-template-columns:repeat(2,1fr)}
}

/* ============ 第三批 · 案头工具箱 ============ */
/* 快捷输入栏 */
.quickbar{flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px 2px;overflow-x:auto;
  scrollbar-width:none;position:relative;z-index:6;animation:up .3s var(--ease) both}
.quickbar::-webkit-scrollbar{display:none}
.quickbar .qb-lab{flex:none;font-size:9px;letter-spacing:.14em;color:var(--muted);
  writing-mode:horizontal-tb;padding-right:3px}
.qb-chip{flex:none;padding:7px 12px;border-radius:12px;background:var(--surface3);
  border:1px solid var(--line);color:var(--text2);font-size:11.5px;white-space:nowrap;
  transition:.26s var(--ease);position:relative;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.qb-chip:hover{color:var(--brand);border-color:var(--brand);transform:translateY(-2px)}
.qb-chip:active{transform:scale(.92)}
.qb-chip.add{color:var(--brand);border-style:dashed;padding:7px 10px}
.qb-chip .del{position:absolute;right:2px;top:1px;font-size:11px;opacity:0;color:#EF6A6A}
.qb-chip:hover .del{opacity:.8}
body.editing .quickbar{display:none}

/* 案头抽屉 */
.deck-mask{position:fixed;inset:0;z-index:94;background:rgba(8,11,22,.28);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
.deck{width:100%;max-width:760px;background:var(--surface);border:1px solid var(--line);border-bottom:0;
  border-radius:30px 30px 0 0;box-shadow:0 -20px 70px rgba(0,0,0,.42);
  height:62vh;display:flex;flex-direction:column;overflow:hidden;animation:inkRise .46s var(--ease) both}
.deck-head{flex:none;padding:14px 18px 10px;display:flex;align-items:center;gap:10px}
.deck-head .tt{flex:1;min-width:0}
.deck-head h3{margin:0;font-size:16px;font-weight:800}
.deck-head small{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.deck-search{flex:none;margin:0 16px 10px;display:flex;align-items:center;gap:9px;height:42px;
  padding:0 14px;border-radius:15px;background:var(--surface2);border:1px solid var(--line)}
.deck-search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:12.5px;color:var(--text)}
.deck-body{flex:1;min-height:0;overflow:auto;padding:0 16px 26px}
.deck-group{margin:14px 2px 9px;font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:700;
  display:flex;align-items:center;gap:8px}
.deck-group::after{content:"";flex:1;height:1px;background:var(--line)}
.deck-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.deck-card{border-radius:18px;background:var(--surface3);border:1px solid var(--line);
  padding:13px 10px;text-align:left;transition:.34s var(--ease);position:relative;overflow:hidden;min-height:88px;
  display:flex;flex-direction:column;gap:6px;animation:up .45s var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
.deck-card::before{content:"";position:absolute;left:-30%;top:-60%;width:80%;height:180%;
  background:radial-gradient(circle,var(--dc,rgba(124,139,255,.18)),transparent 70%);opacity:0;transition:opacity .35s}
.deck-card:hover{transform:translateY(-4px);border-color:var(--brand);box-shadow:var(--shadow2)}
.deck-card:hover::before{opacity:1}
.deck-card:active{transform:scale(.96)}
.deck-card .di{width:30px;height:30px;border-radius:11px;display:grid;place-items:center;
  background:var(--dc,rgba(124,139,255,.14));color:var(--dcol,var(--brand));position:relative;z-index:1}
.deck-card b{font-size:11.5px;font-weight:700;line-height:1.35;position:relative;z-index:1}
.deck-card small{font-size:9px;color:var(--muted);line-height:1.45;position:relative;z-index:1}
.deck-card.hot::after{content:"常用";position:absolute;right:7px;top:7px;font-size:8px;color:var(--brand);
  background:color-mix(in srgb,var(--brand) 12%,var(--surface));padding:2px 5px;border-radius:6px}
.deck-foot{flex:none;padding:9px 16px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--muted)}
@media(max-width:900px){
  .deck{height:70vh}
  .deck-grid{grid-template-columns:repeat(3,1fr)}
  .deck-card{min-height:82px}
}
@media(max-width:520px){.deck-grid{grid-template-columns:repeat(3,1fr);gap:7px}
  .deck-card{padding:11px 8px;min-height:78px}}

/* 全书检索 */
.gs-result{display:flex;gap:11px;padding:11px 13px;border-radius:15px;background:var(--surface3);
  border:1px solid var(--line);margin-bottom:8px;cursor:pointer;transition:.28s var(--ease)}
.gs-result:hover{transform:translateX(3px);border-color:var(--brand);box-shadow:var(--shadow2)}
.gs-result .gi{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand)}
.gs-result .gb{flex:1;min-width:0}
.gs-result b{font-size:12.5px;display:block}
.gs-result .path{font-size:10px;color:var(--muted);margin:3px 0 5px}
.gs-result .snip{font-size:11.5px;color:var(--text2);line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gs-result .snip em{font-style:normal;background:color-mix(in srgb,var(--accent) 34%,transparent);
  color:var(--text);border-radius:3px;padding:0 2px}
.gs-empty{padding:34px 10px;text-align:center;color:var(--muted);font-size:12px;line-height:2}

/* 文稿体检 */
.pf-score{display:flex;align-items:center;gap:18px;padding:14px 16px;border-radius:20px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--brand) 10%,var(--surface)),var(--surface3));
  border:1px solid var(--line);margin-bottom:14px}
.pf-ring{width:78px;height:78px;flex:none;position:relative}
.pf-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.pf-ring .num{position:absolute;inset:0;display:grid;place-items:center;flex-direction:column;
  font-size:23px;font-weight:800;color:var(--brand)}
.pf-ring .num small{font-size:9px;color:var(--muted);font-weight:500;letter-spacing:.1em}
.pf-sum{flex:1;min-width:0}
.pf-sum b{font-size:15px;display:block;margin-bottom:5px}
.pf-sum p{margin:0;font-size:11px;color:var(--text2);line-height:1.8}
.pf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.pf-stat{background:var(--surface3);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.pf-stat b{display:block;font-size:15px;color:var(--brand);font-variant-numeric:tabular-nums}
.pf-stat small{font-size:9px;color:var(--muted)}
.pf-item{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:15px;
  background:var(--surface3);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;transition:.26s var(--ease)}
.pf-item:hover{border-color:var(--brand);transform:translateX(3px)}
.pf-item .pi{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:12px}
.pf-item .pb{flex:1;min-width:0}
.pf-item b{font-size:12px;display:block}
.pf-item p{margin:4px 0 0;font-size:10.5px;color:var(--muted);line-height:1.7}
.pf-item .go{font-size:10px;color:var(--brand);flex:none;align-self:center}
.pf-ok{text-align:center;padding:28px 12px;color:var(--ok);font-size:13px;line-height:2}

/* 章纲卡 */
.oc-card{background:linear-gradient(150deg,color-mix(in srgb,var(--brand) 9%,var(--surface)),var(--surface3));
  border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.oc-card .st{display:flex;gap:6px;margin:10px 0 0}
.oc-card .st button{flex:1;padding:9px 4px;border-radius:12px;background:var(--surface2);
  border:1px solid var(--line);font-size:11px;color:var(--text2);transition:.26s}
.oc-card .st button.on{color:#fff;background:var(--brand);border-color:var(--brand)}
.bk-ch .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;
  vertical-align:middle;background:var(--muted)}
.bk-ch .dot.draft{background:var(--muted)}.bk-ch .dot.revise{background:var(--warn)}
.bk-ch .dot.done{background:var(--ok)}

/* 小黑屋 */
.lock-mask{position:fixed;inset:0;z-index:130;background-color:var(--ink-paper,var(--bg));
  background-image:var(--ink-texture,none);background-size:var(--ink-tex-size,auto);
  display:flex;flex-direction:column;animation:fade .4s both}
.lock-top{flex:none;padding:18px 20px 8px;display:flex;align-items:center;gap:14px}
.lock-top .lt{flex:1;min-width:0}
.lock-top h3{margin:0;font-size:15px}
.lock-top small{font-size:10.5px;color:var(--muted)}
.lock-hud{flex:none;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;
  padding:6px 22px 12px;text-align:center}
.lock-hud .hv{font-size:26px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.lock-hud .hl{font-size:10px;color:var(--muted);letter-spacing:.1em}
.lock-bar{flex:none;height:5px;margin:0 22px 12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.lock-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));
  transition:width .5s var(--ease)}
.lock-editor{flex:1;min-height:0;padding:0 18px 8px}
.lock-editor textarea{width:100%;height:100%;border:0;outline:none;resize:none;background:transparent;
  color:var(--ink-text,var(--text));font-family:var(--edit-font);font-size:var(--edit-size);
  line-height:var(--rule-h,39px);font-weight:var(--ink-weight,400);caret-color:var(--ink-caret,var(--brand));
  color:var(--ink-text,var(--text));
  background-image:repeating-linear-gradient(to bottom,transparent 0,
    transparent calc(var(--rule-h,39px) - 1px),
    var(--ink-rule,var(--rule-line)) calc(var(--rule-h,39px) - 1px),
    var(--ink-rule,var(--rule-line)) var(--rule-h,39px));
  background-attachment:local}
.lock-foot{flex:none;padding:10px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;align-items:center;gap:9px}
.lock-btn{flex:none;padding:10px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);
  color:var(--text2);font-size:11.5px;position:relative;overflow:hidden}
.lock-btn .fill{position:absolute;inset:0;background:var(--brand);opacity:.35;transform-origin:left;
  transform:scaleX(0);transition:transform .1s linear;pointer-events:none}
.lock-btn:active .fill{transform:scaleX(1)}
.lock-tip{flex:1;font-size:10px;color:var(--muted);line-height:1.6}
.lock-win{position:absolute;inset:0;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(14px);display:grid;place-items:center;text-align:center;animation:fade .5s both}
.lock-win .orb{width:104px;height:104px;border-radius:36px;margin:0 auto 20px;display:grid;place-items:center;
  color:#fff;font-size:38px;background:linear-gradient(135deg,var(--brand),var(--brand2));
  box-shadow:0 24px 60px rgba(91,108,249,.4);animation:floaty 3s ease-in-out infinite}
body.locked .app{filter:blur(3px);pointer-events:none}
body.deck-open .rd-bar{opacity:.16;filter:blur(1px);pointer-events:none;transition:opacity .3s}
body.deck-open .quickbar{opacity:0;pointer-events:none}

/* ============ 第四批 · 独立页面 / 封面 / 同步 ============ */
/* 通用页面 */
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px;
  animation:up .5s var(--ease) both}
.page-head .ph-t{flex:1;min-width:200px}
.page-head .eyebrow{font-size:10px;letter-spacing:.22em;color:var(--brand);font-weight:700;margin-bottom:8px}
.page-head h1{margin:0;font-size:29px;font-weight:800;letter-spacing:.01em;
  background:linear-gradient(100deg,var(--text),var(--brand) 90%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.page-head p{margin:7px 0 0;color:var(--muted);font-size:12.5px;line-height:1.7}
.page-acts{display:flex;gap:8px;flex-wrap:wrap}
.pg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pg-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:17px;
  box-shadow:var(--shadow2);transition:.36s var(--ease);position:relative;overflow:hidden;
  animation:up .5s var(--ease) both;animation-delay:calc(var(--i,0)*42ms)}
.pg-card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--brand) 45%,var(--line));
  box-shadow:0 18px 40px rgba(0,0,0,.24)}
.pg-card .tag{display:inline-block;font-size:9px;letter-spacing:.1em;padding:3px 8px;border-radius:7px;
  background:color-mix(in srgb,var(--brand) 13%,var(--surface3));color:var(--brand);margin-bottom:10px}
.pg-card h3{margin:0 0 7px;font-size:14px;font-weight:700}
.pg-card p{margin:0;font-size:11.5px;color:var(--text2);line-height:1.85;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pg-card .foot{display:flex;gap:6px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
.pg-card .foot .grow{flex:1}
.pg-empty{grid-column:1/-1;text-align:center;padding:56px 18px;color:var(--muted);font-size:12.5px;line-height:2}
.pg-empty .orb{width:68px;height:68px;border-radius:24px;margin:0 auto 16px;display:grid;place-items:center;
  color:var(--brand);background:var(--surface2);border:1px solid var(--line)}
.pg-segs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;animation:up .5s var(--ease) both;
  animation-delay:60ms}
.pg-seg{padding:9px 15px;border-radius:13px;background:var(--surface2);border:1px solid var(--line);
  color:var(--text2);font-size:12px;font-weight:600;transition:.3s var(--ease)}
.pg-seg:hover{color:var(--brand);transform:translateY(-2px)}
.pg-seg.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:var(--shadow2)}
.pg-seg b{font-size:10px;opacity:.7;margin-left:5px}
.pg-search{display:flex;align-items:center;gap:10px;height:44px;padding:0 15px;border-radius:15px;
  background:var(--surface2);border:1px solid var(--line);margin-bottom:18px;max-width:420px}
.pg-search input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--text);font-size:12.5px}
.pg-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.pg-hero .h{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;
  box-shadow:var(--shadow2);animation:up .5s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
.pg-hero .h b{display:block;font-size:24px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.pg-hero .h small{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.pg-panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;
  box-shadow:var(--shadow2);margin-bottom:16px;animation:up .5s var(--ease) both}
.pg-panel h3{margin:0 0 5px;font-size:14px}
.pg-panel .sub{font-size:11px;color:var(--muted);line-height:1.8;margin:0 0 15px}
.pg-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pg-row:last-child{border-bottom:0;padding-bottom:0}
.pg-row .pi{width:36px;height:36px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--brand) 11%,var(--surface3));color:var(--brand)}
.pg-row .pb{flex:1;min-width:0}
.pg-row b{font-size:12.5px;display:block}
.pg-row small{font-size:10.5px;color:var(--muted);line-height:1.6;display:block;margin-top:3px}
/* 指南书标记与首次引导 */
.guide-tag.sm{display:inline-block;margin-left:8px;vertical-align:middle;
  font-size:9px;padding:3px 8px;border-radius:7px;color:var(--brand);
  background:color-mix(in srgb,var(--brand) 12%,var(--surface));border:1px solid var(--line);
  letter-spacing:0}
.sl-first{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:14px 15px;
  border-radius:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--brand) 10%,var(--surface)),var(--surface3));
  border:1px dashed color-mix(in srgb,var(--brand) 35%,var(--line));animation:up .5s var(--ease) both}
.sl-first .ic{width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;
  color:var(--brand);background:var(--surface2);font-size:16px}
.sl-first .tx{flex:1;min-width:0}
.sl-first b{display:block;font-size:12.5px;margin-bottom:3px}
.sl-first small{font-size:10.5px;color:var(--muted);line-height:1.7;display:block}

function cwFile(file){
  if(!file||!/^image\//.test(file.type)){toast('请选择一张图片','warn');return}
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      // 居中裁成 2:3，再压到 360×480
      const TW=360,TH=480,cv=document.createElement('canvas');
      cv.width=TW;cv.height=TH;const ctx=cv.getContext('2d');
      const scale=Math.max(TW/img.width,TH/img.height);
      const w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(TW-w)/2,(TH-h)/2,w,h);
      const url=cv.toDataURL('image/jpeg',.76);
      if(url.length>420000){toast('压缩后还是偏大，换一张简单些的图吧','warn');return}
      CW.img=url;renderCW();toast('图已铺好，可以调氛围与书名了');
    };
    img.onerror=()=>toast('这张图读不出来','warn');
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---- 稿纸模式：撤销栈 / 速度 ---- */
let UNDO={id:null,stack:[],redo:[],last:0,suppress:false};
let SPEED={t:Date.now(),w:0,shown:0};
function resetUndo(c){UNDO={id:c.id,stack:[String(c.content||'')],redo:[],last:Date.now(),suppress:false}}
function pushUndo(ta){
  const c=chap();if(!c)return;
  if(UNDO.id!==c.id){resetUndo(c);return}
  const now=Date.now();if(now-UNDO.last<500)return;
  UNDO.last=now;UNDO.stack.push(ta.value);
  if(UNDO.stack.length>60)UNDO.stack.shift();
  UNDO.redo.length=0;
}
function doUndo(){
  const ta=document.getElementById('editorText'),c=chap();if(!ta||!c)return;
  if(UNDO.id!==c.id)resetUndo(c);
  if(UNDO.stack.length<2){toast('没有更早的记录了','warn');return}
  UNDO.redo.push(UNDO.stack.pop());
  UNDO.suppress=true;ta.value=UNDO.stack[UNDO.stack.length-1];onEditorInput(ta);
  requestAnimationFrame(()=>ensureCaretVisible(ta));
}
function doRedo(){
  const ta=document.getElementById('editorText');if(!ta)return;
  if(!UNDO.redo.length){toast('没有可重做的操作','warn');return}
  const v=UNDO.redo.pop();UNDO.stack.push(v);
  UNDO.suppress=true;ta.value=v;onEditorInput(ta);
  requestAnimationFrame(()=>ensureCaretVisible(ta));
}
function updateRuledStatus(){
  const c=chap();if(!c)return;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  const w=words(c.content);
  set('rdCount',fmt(w));set('rdMid',c.title||'未命名章节');
  const mins=(Date.now()-SESSION_START)/60000;
  const rate=mins<0.5?0:Math.min(99999,Math.round(SPEED.w/Math.max(mins/60,0.01)));
  if(S.settings.showPay){
    set('rdSpeed','¥'+Math.round(w/1000*(Number(S.settings.payRate)||80)));
    const u=document.querySelector('.rd-status .r');if(u)u.innerHTML=`<b id="rdSpeed">¥${Math.round(w/1000*(Number(S.settings.payRate)||80))}</b> 稿酬`;
  }else{
    set('rdSpeed',fmt(rate));
    const u=document.querySelector('.rd-status .r');if(u)u.innerHTML=`<b id="rdSpeed">${fmt(rate)}</b> 字/时`;
  }
}

let wakeLock=null;
async function setWakeLock(on){
  try{
    if(on&&!wakeLock&&'wakeLock' in navigator){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{wakeLock=null});
      toast('屏幕常亮已开启');
    }else if(!on&&wakeLock){await wakeLock.release();wakeLock=null;toast('屏幕常亮已关闭')}
  }catch(err){
    S.settings.wakeLock=false;persist();renderInkBody();
    toast('当前浏览器未允许屏幕常亮','warn');
  }
}
function caretLineInfo(ta){
  const cs=getComputedStyle(ta),lh=parseFloat(cs.lineHeight)||S.settings.size*S.settings.lh;
  const fs=parseFloat(cs.fontSize)||S.settings.size;
  const cols=Math.max(8,Math.floor((ta.clientWidth-6)/(fs*.95)));
  let n=0;ta.value.slice(0,ta.selectionStart).split('\n').forEach(seg=>{n+=Math.max(1,Math.ceil(seg.length/cols))});
  return {line:Math.max(0,n-1),lh};
}
function updateLineGlow(){
  const ta=document.getElementById('editorText'),g=document.getElementById('lineGlow');
  if(!ta||!g)return;
  if(!S.settings.lineGlow||document.body.classList.contains('focus')){g.style.opacity=0;return}
  const {line,lh}=caretLineInfo(ta);
  g.style.height=lh+'px';g.style.top=(line*lh-ta.scrollTop)+'px';g.style.opacity=1;
}

function closeMoLing(){MO_STATE.open=false;document.getElementById('moLing')?.classList.remove('on')}
function checkMoLing(ta){
  const box=document.getElementById('moLing');if(!box)return;
  const before=ta.value.slice(0,ta.selectionStart);
  const m=before.match(/(?:^|[\s\u3000])([\/;])([^\s\/;]{0,12})$/);
  if(!m){closeMoLing();return}
  const pre=m[1],q=m[2].toLowerCase();
  const allow=pre==='/'
    ?['墨令','模板','人物']
    :['指令','联想','人物','模板'];
  const all=moItems().filter(x=>allow.includes(x.tag)&&
    (!q||x.k.toLowerCase().includes(q)||(x.d||'').toLowerCase().includes(q))).slice(0,10);
  if(!all.length){closeMoLing();return}
  MO_STATE={open:true,items:all,sel:0,token:pre+m[2],prefix:pre};
  box.innerHTML=`<div class="mo-head">${ic('spark',12)} ${pre==='/'?'墨令':'文本指令 · 联想'}
    <span class="grow"></span>Enter / Tab 落笔 · ← → 选择 · Esc 收起</div>
    <div class="mo-items">${all.map((x,i)=>`<button class="mo-item ${i===0?'sel':''}" data-act="mo-pick" data-i="${i}">
      <b>${esc(pre+x.k)}</b><small>${esc(x.d)}</small><span class="mo-tag">${esc(x.tag)}</span></button>`).join('')}</div>`;
  box.classList.add('on');
}

  document.querySelectorAll('.mo-item').forEach((x,i)=>x.classList.toggle('sel',i===MO_STATE.sel));

function applyMoLing(i){
  const ta=document.getElementById('editorText');if(!ta)return;

function stripMarks(t){
  return String(t||'').split('\n').map(l=>{
    l=l.replace(/^(?:#{1,3}\s+|>\s?|-\s\[[ xX]\]\s?|-\s+|\d+\.\s+)/,'');
    return l.replace(/\*\*(.+?)\*\*/g,'$1').replace(/~~(.+?)~~/g,'$1')
      .replace(/==(.+?)==/g,'$1').replace(/\*(.+?)\*/g,'$1');
  }).join('\n');
}
function outText(c){return S.settings.stripMarkOnExport?stripMarks(c.content):c.content}
function richInline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/~~(.+?)~~/g,'<del>$1</del>')
    .replace(/==(.+?)==/g,'<mark>$1</mark>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>');
}
function renderMarked(raw){
  const lines=String(raw||'').split('\n');
  let out='',list=null;
  const closeList=()=>{if(list){out+='</'+list+'>';list=null}};
  lines.forEach(l=>{
    const t=l.trim();
    if(!t){closeList();return}
    if(/^─{4,}$|^─{4,}\s*$|^-{3,}$|^\*{3,}$/.test(t)){closeList();out+='<hr>';return}
    const h=t.match(/^(#{1,3})\s+(.+)$/);
    if(h){closeList();const n=Number(h[1].length)+1;out+=`<h${n}>${richInline(h[2])}</h${n}>`;return}
    const q=t.match(/^>\s?(.+)$/);
    if(q){closeList();out+=`<blockquote><p>${richInline(q[1])}</p></blockquote>`;return}
    const task=t.match(/^-\s\[([ xX])\]\s*(.*)$/);
    if(task){if(list!=='ul'){closeList();out+='<ul>';list='ul'}
      out+=`<li class="task"><input type="checkbox" disabled ${task[1].toLowerCase()==='x'?'checked':''}> ${richInline(task[2])}</li>`;return}
    const ul=t.match(/^[-•]\s+(.+)$/);
    if(ul){if(list!=='ul'){closeList();out+='<ul>';list='ul'}out+=`<li>${richInline(ul[1])}</li>`;return}
    const ol=t.match(/^\d+\.\s+(.+)$/);
    if(ol){if(list!=='ol'){closeList();out+='<ol>';list='ol'}out+=`<li>${richInline(ol[1])}</li>`;return}
    closeList();out+=`<p>${richInline(l.replace(/^[\u3000\s]+/,''))}</p>`;
  });
  closeList();
  return out||'<p style="color:var(--muted);text-indent:0">这一章还是空白的。</p>';
}

  if(!ta){toast('先打开一章再使用文饰','warn');return}
  ta.focus();
  const s=ta.selectionStart,e=ta.selectionEnd;
  const sel=ta.value.slice(s,e)||ph||'文字';
  const before=ta.value.slice(Math.max(0,s-pre.length),s),after=ta.value.slice(e,e+suf.length);
  if(before===pre&&after===suf){
    ta.setRangeText(sel,s-pre.length,e+suf.length,'end');
    onEditorInput(ta);toast('已取消文饰');return;
  }
  ta.setRangeText(pre+sel+suf,s,e,'end');
  ta.setSelectionRange(s+pre.length,s+pre.length+sel.length);
  onEditorInput(ta);
}
function markBlock(pre,ph){
  const ta=document.getElementById('editorText');
  if(!ta){toast('先打开一章再使用文饰','warn');return}
  if(pre.includes('────')){insertAtCaret(pre);return}
  ta.focus();
  const s=ta.selectionStart,ls=ta.value.lastIndexOf('\n',s-1)+1;
  let le=ta.value.indexOf('\n',s);if(le<0)le=ta.value.length;
  const cur=ta.value.slice(ls,le);
  const clean=cur.replace(/^(?:#{1,3}\s+|>\s?|-\s\[[ xX]\]\s?|-\s+|\d+\.\s+)/,'');
  const same=cur.startsWith(pre);
  ta.setRangeText((same?'':pre)+(clean||ph||'这一节'),ls,le,'end');
  onEditorInput(ta);
}

let HL_TIMER=null;
function scheduleHL(){clearTimeout(HL_TIMER);HL_TIMER=setTimeout(renderHL,90)}
function renderHL(){
  const ta=document.getElementById('editorText'),inner=document.querySelector('.hl-inner');
  if(!ta||!inner)return;
  if(!S.settings.hlEnabled){inner.innerHTML='';return}
  const full=ta.value,text=full.slice(0,20000),len=text.length;
  const occ=new Array(len).fill(null);
  const occupy=(a,b,cls)=>{for(let j=a;j<b&&j<len;j++)if(!occ[j])occ[j]=cls};
  const markWord=(w,cls)=>{if(!w)return;let i=0;while((i=text.indexOf(w,i))>=0){occupy(i,i+w.length,cls);i+=w.length}};
  (S.settings.hlWhite||[]).forEach(w=>markWord(w,'skip'));
  (book()?.chars||[]).forEach(c=>{if(c.name)markWord(c.name,'hl-char')});
  (S.settings.hlWords||[]).forEach(w=>markWord(w,'hl-word'));
  if(S.settings.hlDialog){
    const re=/「[^」\n]*」/g;let m;
    while((m=re.exec(text)))occupy(m.index,m.index+m[0].length,'hl-dialog');
  }
  if(S.settings.hlPunct){
    const re=/[，。！？；：、…—]/g;let m;
    while((m=re.exec(text)))occupy(m.index,m.index+1,'hl-punct');
  }
  let html='',i=0;
  while(i<len){
    const cls=occ[i];
    if(!cls){let j=i;while(j<len&&!occ[j])j++;html+=esc(text.slice(i,j));i=j;continue}
    let j=i;while(j<len&&occ[j]===cls)j++;
    const seg=esc(text.slice(i,j));
    html+=cls==='skip'?seg:`<mark class="${cls}">${seg}</mark>`;i=j;
  }
  if(full.length>20000)html+=esc(full.slice(20000));
  inner.innerHTML=html+'\n';
  syncHL();
}
function syncHL(){
  const ta=document.getElementById('editorText'),inner=document.querySelector('.hl-inner');
  if(ta&&inner)inner.style.transform=`translateY(${-ta.scrollTop}px)`;
}

/* ---- 图片背景：本地压缩后存入 ---- */
function handleBgFile(file){
  if(!file||!/^image\//.test(file.type)){toast('请选择一张图片','warn');return}
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,1280/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const url=cv.toDataURL('image/jpeg',.72);
      if(url.length>1100000){toast('图片有点大，换一张轻一些的吧','warn');return}
      const old=S.settings.inkBgImage;
      S.settings.inkBgImage=url;persist();
      let ok=false;
      try{ok=JSON.parse(localStorage.getItem(KEY)||'{}')?.settings?.inkBgImage===url}catch(e){ok=false}
      if(!ok){S.settings.inkBgImage=old;persist();toast('本地空间不足，背景没能保存','warn');return}
      applyPaperBg();renderInkBody();toast('背景已铺好，浓度可在下面调');
    };
    img.onerror=()=>toast('这张图读不出来','warn');
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---- 段落工坊 ---- */
function paraIndex(ta){
  return ta.value.slice(0,ta.selectionStart).split('\n').length-1;
}
function paraAction(kind){
  const ta=document.getElementById('editorText');
  if(!ta){toast('先打开一章','warn');return}
  const lines=ta.value.split('\n'),i=paraIndex(ta);
  let caret=null;
  const rebuild=(arr,j)=>{
    const pos=arr.slice(0,j).join('\n').length+(j?1:0);
    ta.value=arr.join('\n');
    ta.setSelectionRange(pos,pos);
  };
  if(kind==='up'&&i>0){[lines[i-1],lines[i]]=[lines[i],lines[i-1]];rebuild(lines,i-1)}
  else if(kind==='down'&&i<lines.length-1){[lines[i],lines[i+1]]=[lines[i+1],lines[i]];rebuild(lines,i+1)}
  else if(kind==='dup'){lines.splice(i+1,0,lines[i]);rebuild(lines,i+1)}
  else if(kind==='del'&&lines.length>1){lines.splice(i,1);rebuild(lines,Math.min(i,lines.length-1))}
  else if(kind==='blank'){lines.splice(i+1,0,'');rebuild(lines,i+1)}
  else if(kind==='brush'){
    const prefixOf=l=>(l.match(/^[\s\u3000]*(?:#{1,3}\s+|>\s?|[-•]\s+|-\s\[[ xX]\]\s?|\d+\.\s+)?/)||[''])[0];
    const p=prefixOf(lines[i]);
    if(!p.trim()){toast('这一段没有可刷的格式','warn');return}
    for(let j=i+1;j<lines.length&&j<=i+4;j++){
      if(!lines[j].trim())continue;
      lines[j]=p+lines[j].replace(/^[\s\u3000]*(?:#{1,3}\s+|>\s?|[-•]\s+|-\s\[[ xX]\]\s?|\d+\.\s+)?/,'');break;
    }
    rebuild(lines,i);
  }
  else if(kind==='tidy'){
    const out=[];let blank=0;
    lines.forEach(l=>{if(!l.trim()){blank++;if(blank<=1)out.push('')}else{blank=0;out.push(l)}});
    ta.value=out.join('\n');ta.setSelectionRange(0,0);
  }
  else {toast(kind==='up'?'已经是第一段了':'已经是最后一段了','warn');return}
  onEditorInput(ta);ta.focus();
  requestAnimationFrame(()=>ensureCaretVisible(ta));
  toast(({up:'段落上移',down:'段落下移',dup:'已复制段落',del:'已删除段落',blank:'已插入空行',
    brush:'格式已刷给下一段',tidy:'空行整理好了'})[kind]||'完成');
}
function splitAtCaret(){
  const ta=document.getElementById('editorText'),b=book(),c=chap();
  if(!ta||!b||!c)return;
  const pos=ta.selectionStart,v=ta.value;
  if(pos>=v.length-1){toast('光标后面还没有内容','warn');return}
  const left=v.slice(0,pos).replace(/\n+$/,'\n'),right=v.slice(pos).replace(/^\n+/,'');
  if(!right.trim()){toast('光标后面还没有内容','warn');return}
  confirmBox('从光标处分成两章',`「${c.title}」会保留前半部分，后半部分约 ${fmt(words(right))} 字会另起一章。原内容仍可从版本历史找回。`,
    ()=>{

      const nc={id:uid(),volumeId:c.volumeId||null,title:c.title+' · 续',content:indentText()+right,
        updatedAt:Date.now(),card:{status:'draft',goal:'',points:''}};

    });
}

/* ---- 文稿体检 ---- */
function proofIssues(t){
  const out=[],c=chap();
  const add=(lv,title,desc,pos,fix)=>out.push({lv,title,desc,pos:pos||0,fix:fix||''});
  const pairs=[['「','」','直角引号'],['“','”','弯引号'],['（','）','圆括号'],['《','》','书名号'],['【','】','方头括号']];
  pairs.forEach(([a,z,n])=>{
    const na=(t.split(a).length-1),nz=(t.split(z).length-1);
    if(na!==nz)add('warn',n+'没有配好对',`${a} 有 ${na} 个，${z} 有 ${nz} 个${na>nz?'，多了一个开口':'，多了一个收口'}。`,t.indexOf(a));
  });
  const dupRe=/([的了着过吗呢吧啊在和就都也还])\1/g;let m;
  const seen=new Set();
  while((m=dupRe.exec(t))){
    if(LEGAL_REPEAT.test(t.slice(m.index,m.index+4)))continue;
    const key=m.index;if(seen.has(key))break;seen.add(key);
    if(out.length<40)add('warn','疑似叠字误写',`「${m[0]}」连在了一起，位置第 ${m.index} 字。`,m.index);
  }
  const en=/[\u4e00-\u9fff][,;:?!]/g;
  while((m=en.exec(t))&&out.length<40)add('tip','中英标点混用',
    `「${m[0]}」里用了半角标点，中文段落里建议换成全角。`,m.index);
  let p=0;t.split('\n').forEach((l,i)=>{
    if(words(l)>280)add('tip','这一段有点长',`第 ${i+1} 行约 ${words(l)} 字，读起来会喘不过气，可以拆成两三段。`,p);
    if(Number(S.settings.indent)>0&&l.trim()&&!/^[\u3000\s]/.test(l)&&!/^(#{1,3}\s|>\s?|[-•]\s|\d+\.\s)/.test(l))
      add('tip','段首没缩进',`第 ${i+1} 行开头空着，和全章格式不一致。`,p);
    p+=l.length+1;
  });
  const blanks=(t.match(/\n{3,}/g)||[]).length;
  if(blanks)add('tip','空行有点多',`有 ${blanks} 处连续三个以上换行，建议压成一个空行。`,t.search(/\n{3,}/));
  const w=words(t),ex=(t.match(/[！!]/g)||[]).length;
  if(w>400&&ex/w*1000>12)add('tip','感叹号偏密',`每千字约 ${Math.round(ex/w*1000)} 个感叹号，留一点给沉默。`,t.search(/[！!]/));
  if(c&&/^第?\s*\d*\s*章?\s*$/.test(c.title.trim()))add('tip','章节还没起名','给这一章一个名字，回头翻目录会好找很多。',0);
  return out.slice(0,40);
}
function proofFix(){

  t=t.replace(/([\u4e00-\u9fff]),/g,'$1，').replace(/([\u4e00-\u9fff]);/g,'$1；')

/* ---- 小黑屋 ---- */
let LOCK={active:false,mode:'words',target:500,start:0,startW:0,deadline:0,timer:null,done:false};
function lockIn(){
  if(LOCK.active)return;
  const c=chap();if(!c){toast('先打开一章','warn');return}
  const mode=S.settings.lockMode||'words',target=mode==='words'?(S.settings.lockTarget||500):(S.settings.lockMinutes||20);
  const m=document.createElement('div');m.className='lock-mask';m.id='lockMask';
  m.innerHTML=`<div class="lock-top"><div class="lt"><h3>小黑屋 · 写满再走</h3>
      <small>${mode==='words'?'目标 '+target+' 字':'目标 '+target+' 分钟'} · 期间只留稿纸</small></div>
      <div style="font-size:10px;color:var(--muted)">${esc(c.title)}</div></div>
    <div class="lock-hud"><div><div class="hv" id="lkNow">0</div><div class="hl">${mode==='words'?'已写 · 字':'已写 · 字'}</div></div>
      <div style="font-size:11px;color:var(--muted)">／</div>
      <div><div class="hv" id="lkGoal">${target}</div><div class="hl">${mode==='words'?'目标 · 字':'倒计时 · 分'}</div></div></div>
    <div class="lock-bar"><i id="lkBar" style="width:0%"></i></div>
    <div class="lock-editor"><textarea id="lockText" spellcheck="false" placeholder="　　从这里开始，写满才放你出去…"></textarea></div>
    <div class="lock-foot"><button class="lock-btn" id="lkExit">${ic('x',13)} 长按 1.6 秒退出<span class="fill" id="lkFill"></span></button>
      <span class="lock-tip">未达成时也可以长按离开，不拦你，只是提醒一下。</span>
      <button class="btn soft sm" data-act="lk-more">+ 加码</button></div>`;
  document.body.appendChild(m);document.body.classList.add('locked');
  LOCK={active:true,mode,target,start:Date.now(),startW:words(c.content),gain:0,
    deadline:Date.now()+target*60000,timer:null,done:false};
  const ta=m.querySelector('#lockText');ta.value=c.content;
  ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  ta.addEventListener('input',()=>{const ch=chap();if(!ch)return;
    ch.content=ta.value;ch.updatedAt=Date.now();if(book())book().updatedAt=Date.now();
    const nw=words(ta.value);
    if(nw>LOCK.lastW){LOCK.gain+=nw-LOCK.lastW;addToday(nw-LOCK.lastW)}
    LOCK.lastW=nw;
    persist();updateLockHud()});
  LOCK.lastW=words(c.content);
  // 长按退出
  const btn=m.querySelector('#lkExit'),fill=m.querySelector('#lkFill');
  let hold=null,t0=0;
  const begin=e=>{e.preventDefault();t0=Date.now();
    fill.style.transition='transform 1.6s linear';fill.style.transform='scaleX(1)';
    hold=setInterval(()=>{if(Date.now()-t0>=1600){clearInterval(hold);hold=null;unlock(true)}},60)};
  const end=()=>{clearInterval(hold);hold=null;fill.style.transition='transform .2s';fill.style.transform='scaleX(0)'};
  btn.addEventListener('pointerdown',begin);
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,end));
  LOCK.timer=setInterval(updateLockHud,1000);
  updateLockHud();
}
function updateLockHud(){
  if(!LOCK.active)return;
  const ta=document.getElementById('lockText');if(!ta)return;
  const w=words(ta.value),gain=LOCK.gain||0;
  let val,goal,pct,done;
  if(LOCK.mode==='words'){val=gain;goal=LOCK.target;pct=Math.min(100,gain/LOCK.target*100);done=gain>=LOCK.target}
  else{
    const left=Math.max(0,Math.ceil((LOCK.deadline-Date.now())/60000));
    val=gain;goal=left;pct=Math.min(100,(1-(LOCK.deadline-Date.now())/(LOCK.target*60000))*100);
    done=Date.now()>=LOCK.deadline;
  }
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set('lkNow',val);set('lkGoal',goal);
  const bar=document.getElementById('lkBar');if(bar)bar.style.width=Math.max(0,Math.min(100,pct))+'%';
  if(done&&!LOCK.done){LOCK.done=true;
    const m=document.getElementById('lockMask');if(!m)return;
    const win=document.createElement('div');win.className='lock-win';
    win.innerHTML=`<div><div class="orb">✦</div><h2 style="margin:0 0 8px;font-size:22px">写满了，放你出去</h2>
      <p style="color:var(--muted);font-size:12px;line-height:1.9;margin:0 0 22px">
        这一趟新增 ${fmt(gain)} 字${LOCK.mode==='time'?' · '+LOCK.target+' 分钟':''}。<br>合上本子，明天再来。</p>
      <button class="btn primary" id="lkDone">${ic('check',15)} 收工</button></div>`;
    m.appendChild(win);win.querySelector('#lkDone').onclick=()=>unlock(false);
  }
}
function unlock(early){
  if(!LOCK.active)return;
  clearInterval(LOCK.timer);LOCK.active=false;
  document.getElementById('lockMask')?.remove();
  document.body.classList.remove('locked');
  snapshot(chap(),true);persist();renderAll();
  toast(early?'提前出来了，下次再关自己一会儿':'小黑屋解锁 ✦ 辛苦了');
}

function renderDeck(){

  const k=DECK_Q.trim().toLowerCase();
  const list=DECK_CARDS.filter(x=>!k||(x.t+x.d+x.g+x.k).toLowerCase().includes(k));
  const recent=(S.settings.deckRecent||[]).map(key=>list.find(x=>x.k===key)).filter(Boolean).slice(0,4);

function setSaveState(s){
  ['saveDot','saveDot2'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.toggle('writing',s==='writing')});
  const a=document.getElementById('saveTxt'),b=document.getElementById('statusSave');

function onEditorInput(ta){
  const c=chap();if(!c)return;
  c.content=ta.value;const w=words(ta.value);
  if(w>lastWords){addToday(w-lastWords);SPEED.w+=w-lastWords}
  lastWords=w;c.updatedAt=Date.now();if(book())book().updatedAt=Date.now();
  if(UNDO.suppress)UNDO.suppress=false;else pushUndo(ta);
  save();updateCounts();updateRuledStatus();
  if(S.settings.typewriter)centerCaret(ta);
  else if(document.body.classList.contains('editing'))requestAnimationFrame(()=>ensureCaretVisible(ta));
  checkMoLing(ta);updateLineGlow();saveEditorPos();scheduleHL();
}
function updateCounts(){
  const c=chap();if(!c)return;const w=words(c.content),b=book();
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set('miniCount',fmt(w)+' 字');set('footCh',fmt(w));set('footBook',fmt(bookWords(b)));
  updateTargetChip();
}
function centerCaret(ta){
  const st=S.settings;
  const lh=parseFloat(getComputedStyle(ta).lineHeight)||st.size*st.lh;
  const before=ta.value.slice(0,ta.selectionStart);
  const wrapped=Math.floor(before.length/Math.max(1,Math.floor(ta.clientWidth/(st.size*.95))));
  const line=before.split('\n').length-1+wrapped;
  ta.scrollTop=Math.max(0,line*lh-ta.clientHeight/2+lh);
}
function pickCh(id){
  const ta=document.getElementById('editorText');
  if(ta&&chap()){const old=chap();old.content=ta.value;old.scrollTop=ta.scrollTop;old.caret=ta.selectionStart}
  S.activeChapterId=id;if(book())book().lastChapterId=id;
  persist();closeDrawers();renderTree();renderEditor();renderInspector();
  const n=document.getElementById('editorText');if(n)setTimeout(()=>n.focus(),60);
}
function newChapter(title,content='',volumeId=null){
  const b=book();if(!b)return;
  const c={id:uid(),volumeId,title:title||'未命名章节 '+(b.chapters.length+1),content:content||'　　',updatedAt:Date.now()};

  const scale=realMax||1;
  const activeDays=Object.values(S.stats).filter(v=>v>0).length;
  const avg=activeDays?Math.round(Object.values(S.stats).reduce((a,b)=>a+b,0)/activeDays):0;

function download(name,text,type='text/plain;charset=utf-8'){
  const blob=new Blob(['\ufeff'+text],{type});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('已导出 '+name);
}
const safeName=s=>String(s||'未命名').replace(/[\\/:*?"<>|]/g,'_');
function exportBook(b,fmtType){
  const head=`${b.title}\n作者：${b.author||'佚名'}\n${b.desc||''}\n`;
  const parts=b.chapters.map(c=>`\n\n${'='.repeat(12)} ${c.title} ${'='.repeat(12)}\n\n${outText(c)}`);
  let text=head+parts.join('\n'),ext='txt';
  if(fmtType==='md'){text=`# ${b.title}\n\n> ${b.author||'佚名'} · ${b.desc||''}\n`+b.chapters.map(c=>`\n## ${c.title}\n\n${c.content.replace(/\n/g,'\n\n')}`).join('\n');ext='md'}
  if(fmtType==='html'){text=`<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>${esc(b.title)}</title>
<style>body{max-width:760px;margin:60px auto;padding:0 24px;font:19px/2 "Songti SC",serif;color:#2b2b2b;background:#fff}
h1{font-size:32px}h2.chapter{margin-top:60px;border-bottom:1px solid #eee;padding-bottom:12px}
p{text-indent:2em}blockquote{border-left:3px solid #ccc;padding-left:16px;color:#666;margin:12px 0}
mark{background:#ffe9a8;padding:1px 3px;border-radius:3px}del{opacity:.55}
hr{border:0;border-top:1px solid #eee;margin:28px 0}h3,h4{color:#444}
ul,ol{padding-left:28px}.task{list-style:none;margin-left:-20px}</style>
<h1>${esc(b.title)}</h1><p style="text-indent:0;color:#888">${esc(b.author||'佚名')} · ${esc(b.desc||'')}</p>`+
  b.chapters.map(c=>`<h2 class="chapter">${esc(c.title)}</h2>${renderMarked(c.content)}`).join('')+'</html>';ext='html'}
  download(`${safeName(b.title)}.${ext}`,text,ext==='html'?'text/html;charset=utf-8':'text/plain;charset=utf-8');
}

function pomoModal(){
  const m=modal('专注计时',`<div style="text-align:center">
    <div style="display:flex;justify-content:center;gap:8px;margin-bottom:22px">
      ${[['25',1500],['45',2700],['5',300]].map(([t,s])=>`<button class="btn ${pomo.mode==s/60?'primary':'soft'} sm" data-act="pomo-mode" data-s="${s}" data-t="${t}">${t} 分钟</button>`).join('')}</div>
    <div style="position:relative;width:200px;height:200px;margin:0 auto 18px">
      <svg viewBox="0 0 200 200" style="transform:rotate(-90deg);width:100%;height:100%">
        <circle cx="100" cy="100" r="86" fill="none" stroke="var(--surface2)" stroke-width="10"/>
        <circle id="pomoRing" cx="100" cy="100" r="86" fill="none" stroke="var(--brand)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="${2*Math.PI*86}" stroke-dashoffset="0" style="transition:stroke-dashoffset .9s linear"/></svg>
      <div style="position:absolute;inset:0;display:grid;place-items:center;flex-direction:column">
        <div id="pomoTime" style="font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em">25:00</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px" id="pomoLabel">先写一段，不必写完</div></div></div>
    <div style="display:flex;justify-content:center;gap:10px">
      <button class="btn primary" data-act="pomo-toggle" id="pomoToggle">${ic('play',15)} 开始专注</button>
      <button class="btn ghost" data-act="pomo-reset">${ic('rotate',15)} 重置</button></div>
    <p style="font-size:11px;color:var(--muted);margin-top:20px;line-height:1.7">计时器会在后台继续走。结束后给你一个轻轻的提醒。</p></div>`,'',440);
  window.__pomoMask=m;updatePomoUI();
}
function updatePomoUI(){
  const C=2*Math.PI*86;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  const mm=String(Math.floor(pomo.left/60)).padStart(2,'0'),ss=String(pomo.left%60).padStart(2,'0');
  set('pomoTime',mm+':'+ss);set('pomoMini',mm+':'+ss);
  const r=document.getElementById('pomoRing');if(r)r.setAttribute('stroke-dashoffset',String(C*(1-pomo.left/pomo.total)));
  const t=document.getElementById('pomoToggle');
  if(t)t.innerHTML=(pomo.running?ic('pause',15)+' 暂停一下':ic('play',15)+' 开始专注');
  const l=document.getElementById('pomoLabel');if(l)l.textContent=pomo.running?'笔不要停，也不用急':'先写一段，不必写完';
}
function pomoTick(){
  if(!pomo.running)return;pomo.left--;
  if(pomo.left<=0){pomoStop();pomo.left=pomo.total;toast('这一段专注结束了，起来动一动吧 ☕');beep()}
  updatePomoUI();
}
function pomoStart(){if(pomo.running)return;pomo.running=true;pomo.timer=setInterval(pomoTick,1000);updatePomoUI()}
function pomoStop(){pomo.running=false;clearInterval(pomo.timer);pomo.timer=null;updatePomoUI()}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.frequency.value=660;o.type='sine';g.gain.setValueAtTime(.12,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.7);o.start();o.stop(a.currentTime+.7)}catch(e){}}

const SYNC_MODES=[
 ['endpoint','自定义同步端点','填一个你自己的中转地址，最稳、真正能多端','ul','推荐'],
 ['webdav','坚果云 / WebDAV','直连坚果云等 WebDAV 服务器，存成一个 JSON','cloud','可能被浏览器 CORS 拦截'],
 ['file','同步文件','导出 .inkwell.json，放进坚果云同步文件夹','dl','不需要服务器']
];
const WORKER_CODE=`// Cloudflare Worker · 墨屿同步端点
// 1. 新建 Worker，粘贴本段  2. 建 KV 命名空间，绑定名填 INKWELL
// 3. 在「设置 → 变量」加一个 Secret：TOKEN（自己随便设一串）
// 4. 部署后把 Worker 地址填进墨屿，Token 填同一串即可
export default {
  async fetch(request, env) {
    const C = {
      'Access-Control-Allow-Origin': '*',
      'Access-Control-Allow-Methods': 'POST, OPTIONS',
      'Access-Control-Allow-Headers': 'Content-Type, X-Inkwell-Token'
    };
    if (request.method === 'OPTIONS')
      return new Response(null, { headers: C });
    const J = (o, s = 200) => new Response(JSON.stringify(o), {
      status: s, headers: { 'Content-Type': 'application/json', ...C }
    });
    if (env.TOKEN && request.headers.get('X-Inkwell-Token') !== env.TOKEN)
      return J({ ok: false, error: 'token 不对' }, 401);
    let body;
    try { body = await request.json(); }
    catch (e) { return J({ ok: false, error: 'bad json' }, 400); }
    if (body.action === 'get') {
      const v = await env.INKWELL.get('data');
      return J({ ok: true, payload: v ? JSON.parse(v) : null });
    }
    if (body.action === 'put') {
      await env.INKWELL.put('data', JSON.stringify(body.payload));
      return J({ ok: true });
    }
    return J({ ok: false, error: 'bad action' }, 400);
  }
};`;
let SYNC_APPLYING=false,SYNC_INTERNAL=false,LAST_HASH='',SYNC_TIMER=null,SYNC_BUSY=false;
function dataHash(str){
  let h=0;for(let i=0;i<str.length;i+=Math.max(1,Math.floor(str.length/4000)))h=(h*31+str.charCodeAt(i))|0;
  return str.length+'_'+h;
}
function afterPersist(str){
  const h=dataHash(str),changed=!!LAST_HASH&&h!==LAST_HASH;
  LAST_HASH=h;
  if(SYNC_APPLYING||SYNC_INTERNAL||!changed)return;
  S.sync.dirty=true;
  if(S.sync.mode!=='off'&&S.sync.state!=='err')setSyncState('pending');
  scheduleAutoSync();
}
function setSyncState(st){
  SYNC_INTERNAL=true;S.sync.state=st;persist();SYNC_INTERNAL=false;
  const ss=document.getElementById('syncStatus');
  if(ss){
    ss.className='sync-status '+(st==='ok'?'ok':st==='pending'?'pending':st==='err'?'err':'');
    ss.innerHTML=`<i></i><span>${st==='ok'?'已同步':st==='pending'?'待同步':st==='err'?'同步失败':'未开启同步'}</span>`;
  }
}
function syncLog(msg,kind='info'){
  S.sync.log=S.sync.log||[];
  S.sync.log.unshift({t:Date.now(),msg,kind});
  S.sync.log=S.sync.log.slice(0,12);
  SYNC_INTERNAL=true;persist();SYNC_INTERNAL=false;
  if(S.ui.view==='sync')renderSyncPage();
}
function syncPkg(){
  return {app:'inkwell',v:1,rev:(S.rev||0)+1,updatedAt:Date.now(),device:S.device,
    data:{books:S.books,settings:S.settings,world:S.world,ideas:S.ideas,
      snippets:S.snippets,stats:S.stats,trash:S.trash,ui:S.ui,
      activeBookId:S.activeBookId,activeChapterId:S.activeChapterId}};
}
function syncSummary(pkg){
  const d=pkg?.data||{};
  const books=d.books||[],ch=books.reduce((a,b)=>a+(b.chapters||[]).length,0);
  const tw=books.reduce((a,b)=>a+(b.chapters||[]).reduce((x,c)=>x+words(c.content),0),0);
  return {books:books.length,chapters:ch,words:tw,rev:pkg?.rev||0,
    device:pkg?.device||'未知设备',at:pkg?.updatedAt||0};
}
function syncApply(pkg){
  const d=pkg.data||{};
  SYNC_APPLYING=true;
  S.books=d.books||S.books;S.settings={...DEF,...(d.settings||{})};
  S.world=d.world||S.world;S.ideas=d.ideas||S.ideas;
  S.snippets=d.snippets||S.snippets;S.stats=d.stats||S.stats;
  S.trash=d.trash||S.trash;S.ui={...S.ui,...(d.ui||{})};
  S.activeBookId=d.activeBookId??S.activeBookId;
  S.activeChapterId=d.activeChapterId??S.activeChapterId;
  S.rev=pkg.rev||S.rev;
  S.sync.remoteRev=S.rev;S.sync.dirty=false;S.sync.lastSync=Date.now();
  persist();SYNC_APPLYING=false;
  setSyncState('ok');syncLog('已从 '+pkg.device+' 拉取并应用','ok');
  renderAll();
}
async function syncGet(){
  const s=S.sync;
  if(s.mode==='endpoint'){
    const r=await fetch(s.url,{method:'POST',headers:{'Content-Type':'application/json',
      'X-Inkwell-Token':s.token||''},body:JSON.stringify({action:'get'})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();if(!j.ok)throw new Error(j.error||'端点返回失败');
    return j.payload;
  }
  if(s.mode==='webdav'){
    const r=await fetch(webdavURL(),{headers:webdavHeaders()});
    if(r.status===404)return null;
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }
  throw new Error('同步文件模式请手动选择文件导入');
}
async function syncPut(pkg){
  const s=S.sync;
  if(s.mode==='endpoint'){
    const r=await fetch(s.url,{method:'POST',headers:{'Content-Type':'application/json',
      'X-Inkwell-Token':s.token||''},body:JSON.stringify({action:'put',payload:pkg})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();if(!j.ok)throw new Error(j.error||'端点返回失败');
    return;
  }
  if(s.mode==='webdav'){
    await webdavMkdir();
    const r=await fetch(webdavURL(),{method:'PUT',headers:{...webdavHeaders(),
      'Content-Type':'application/json;charset=utf-8'},body:JSON.stringify(pkg)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return;
  }
  throw new Error('同步文件模式请用「导出同步文件」');
}
function webdavURL(){
  const base=(S.sync.url||'https://dav.jianguoyun.com/dav/').replace(/\/+$/,'/');
  const path=(S.sync.path||'墨屿/inkwell-sync.json').replace(/^\/+/,'');
  return base+path.split('/').map(encodeURIComponent).join('/');
}
function webdavHeaders(){
  const auth=btoa(unescape(encodeURIComponent((S.sync.user||'')+':'+(S.sync.pass||''))));
  return {'Authorization':'Basic '+auth};
}
async function webdavMkdir(){
  const base=(S.sync.url||'https://dav.jianguoyun.com/dav/').replace(/\/+$/,'/');
  const dir=(S.sync.path||'墨屿/inkwell-sync.json').split('/').slice(0,-1).join('/');
  if(!dir)return;
  const u=base+dir.split('/').map(encodeURIComponent).join('/')+'/';
  try{await fetch(u,{method:'MKCOL',headers:webdavHeaders()})}catch(e){}
}
function scheduleAutoSync(){
  if(!S.sync.auto||S.sync.mode==='off'||S.sync.mode==='file')return;
  clearTimeout(SYNC_TIMER);
  SYNC_TIMER=setTimeout(()=>syncNow('put',true),25000);
}
async function syncNow(dir='put',silent=false){
  const s=S.sync;
  if(s.mode==='off'){if(!silent)toast('先在下面选一种同步方式','warn');return}
  if(s.mode==='file'){if(!silent)toast('同步文件模式：用「导出 / 导入」即可','warn');return}
  if(s.mode==='endpoint'&&!s.url){if(!silent)toast('先填同步端点地址','warn');return}
  if(s.mode==='webdav'&&(!s.user||!s.pass)){if(!silent)toast('先填账号与应用密码','warn');return}
  if(SYNC_BUSY)return;
  SYNC_BUSY=true;
  if(!silent)toast(dir==='get'?'正在拉取…':'正在上传…');
  try{
    if(dir==='get'||s.lastSync===0){
      const remote=await syncGet();
      if(remote){
        const localdirty=s.dirty;
        if(remote.rev>(S.rev||0)&&localdirty){
          SYNC_BUSY=false;
          syncConflict(remote);return;
        }
        if(remote.rev>=(S.rev||0)||!localdirty){
          syncApply(remote);SYNC_BUSY=false;
          if(!silent)toast('已同步远端内容 ✦');return;
        }
      }
    }
    const pkg=syncPkg();
    await syncPut(pkg);
    S.rev=pkg.rev;
    s.remoteRev=pkg.rev;s.dirty=false;s.lastSync=Date.now();
    setSyncState('ok');syncLog('已上传到 '+(s.mode==='webdav'?'WebDAV':'同步端点'),'ok');
    if(!silent)toast('同步完成 ✦');
    if(S.ui.view==='sync')renderSyncPage();
  }catch(e){
    let msg=String(e.message||e);
    if(msg.includes('Failed to fetch')||msg.includes('NetworkError')||msg.includes('CORS'))
      msg='浏览器拦截了直连请求（CORS）。坚果云 WebDAV 通常不允许网页直接访问，建议改用「自定义同步端点」或「同步文件」。';
    setSyncState('err');syncLog(msg.slice(0,140),'err');
    if(!silent)toast(msg.slice(0,90),'warn');
    if(S.ui.view==='sync')renderSyncPage();
  }finally{SYNC_BUSY=false}
}
function syncConflict(remote){

  const lb=S.books,lch=lb.reduce((x,b)=>x+(b.chapters||[]).length,0),
    ltw=lb.reduce((x,b)=>x+(b.chapters||[]).reduce((y,c)=>y+words(c.content),0),0);

      <div class="pg-panel" style="flex:1;min-width:180px;margin:0"><h3>本机 · ${esc(l.device)}</h3>

        <button class="btn soft sm" data-act="sync-use-local" style="width:100%">用本机覆盖远端</button></div></div>`,
    `<button class="btn ghost" data-close style="margin-right:auto">先不同步</button>
     <button class="btn ghost" data-act="export-all">${ic('dl',13)} 导出备份</button>`,620);
  window.__SYNC_REMOTE=remote;

  }catch(e){

    if(msg.includes('Failed to fetch')||msg.includes('NetworkError'))
      msg='被浏览器 CORS 拦截：坚果云 WebDAV 不允许网页直连。请改用「自定义同步端点」或「同步文件」。';
    setSyncState('err');syncLog('测试失败：'+msg.slice(0,120),'err');

  }
}

function saveSyncFields(){
  const g=id=>document.getElementById(id)?.value??'';
  if(document.getElementById('syncUrl')!==null)S.sync.url=g('syncUrl').trim();
  if(document.getElementById('syncToken')!==null)S.sync.token=g('syncToken');
  if(document.getElementById('syncUser')!==null)S.sync.user=g('syncUser').trim();
  if(document.getElementById('syncPass')!==null)S.sync.pass=g('syncPass');
  if(document.getElementById('syncPath')!==null)S.sync.path=g('syncPath').trim();
  persist();toast('同步设置已存到本机');
}
function syncBoot(){
  LAST_HASH=dataHash(JSON.stringify(S));
  if(S.sync.auto&&S.sync.mode!=='off'&&S.sync.mode!=='file'){
    setTimeout(()=>syncNow('get',true),2600);
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden&&S.sync.auto&&S.sync.mode!=='off'&&S.sync.mode!=='file'&&S.sync.dirty)
      syncNow('put',true);
  });
}

function renderSearch(q){
  const pop=document.getElementById('searchPop');
  q=q.trim().toLowerCase();if(!q){pop.innerHTML='';return}
  const out=[];
  S.books.forEach(b=>{
    if(b.title.toLowerCase().includes(q))out.push({t:b.title,s:'作品 · '+b.chapters.length+' 章',act:'open-book',id:b.id,icon:'book'});
    b.chapters.forEach(c=>{
      if(c.title.toLowerCase().includes(q)||c.content.toLowerCase().includes(q)){
        const i=c.content.toLowerCase().indexOf(q);
        const sn=i>=0?'…'+c.content.slice(Math.max(0,i-18),i+34).replace(/\n/g,' ')+'…':'章节 · '+fmt(words(c.content))+' 字';
        out.push({t:c.title,s:b.title+' · '+sn,act:'jump',id:b.id,ch:c.id,icon:'file'});
      }});
  });
  pop.innerHTML=out.slice(0,9).map(r=>`<div class="sr" data-act="${r.act}" data-id="${r.id}" ${r.ch?`data-ch="${r.ch}"`:''}>
    ${ic(r.icon,15)}<div style="min-width:0"><b>${esc(r.t)}</b><span>${esc(r.s)}</span></div></div>`).join('')||'<div class="sr"><span>没有找到相关内容</span></div>';
}

/* ==================== 查找替换 ==================== */
function findNext(){
  const ta=document.getElementById('editorText'),q=document.getElementById('findQ').value;
  if(!q||!ta)return;
  const all=ta.value.toLowerCase().split(q.toLowerCase()).length-1;
  const cnt=document.getElementById('findCnt');if(cnt)cnt.textContent=all?`共 ${all} 处`:'无匹配';
  let i=ta.value.toLowerCase().indexOf(q.toLowerCase(),ta.selectionEnd);
  if(i<0)i=ta.value.toLowerCase().indexOf(q.toLowerCase());
  if(i>=0){ta.focus();ta.setSelectionRange(i,i+q.length);const lh=parseFloat(getComputedStyle(ta).lineHeight)||38;
    ta.scrollTop=Math.max(0,(ta.value.slice(0,i).split('\n').length-1)*lh-ta.clientHeight/3)}
}
function replaceOne(all=false){
  const ta=document.getElementById('editorText'),q=document.getElementById('findQ').value,r=document.getElementById('repQ').value;
  if(!q||!ta)return;
  if(all){ta.value=ta.value.split(q).join(r)}
  else{const a=ta.selectionStart,b=ta.selectionEnd;
    if(ta.value.slice(a,b).toLowerCase()===q.toLowerCase()){ta.value=ta.value.slice(0,a)+r+ta.value.slice(b);ta.setSelectionRange(a,a+r.length)}
    else{findNext();return}}
  onEditorInput(ta);toast(all?'已全部替换':'已替换一处');
}

/* ==================== 菜单（通用气泡） ==================== */
function popupMenu(anchor,items){
  document.querySelectorAll('.ctx-menu').forEach(x=>x.remove());
  const r=anchor.getBoundingClientRect();
  const d=document.createElement('div');d.className='ctx-menu';
  Object.assign(d.style,{position:'fixed',zIndex:100,left:Math.min(r.left,innerWidth-210)+'px',top:Math.min(r.bottom+6,innerHeight-260)+'px',
    background:'var(--surface)',border:'1px solid var(--line)',borderRadius:'16px',boxShadow:'var(--shadow)',padding:'7px',minWidth:'190px',
    animation:'pop .25s cubic-bezier(.22,.9,.26,1) both'});
  d.innerHTML=items.map(it=>`<button class="sr" data-act="${it.act}" ${it.id?`data-id="${it.id}"`:''} ${it.ch?`data-ch="${it.ch}"`:''} style="width:100%;text-align:left">
    ${ic(it.icon||'file',15)}<b style="font-weight:500;color:${it.danger?'#EF6A6A':'var(--text)'}">${esc(it.text)}</b></button>`).join('');
  document.body.appendChild(d);
  setTimeout(()=>document.addEventListener('click',function h(e){if(!d.contains(e.target)){d.remove();document.removeEventListener('click',h)}}),0);
}

/* ==================== 事件委托 ==================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.closest('.ctx-menu'))document.querySelectorAll('.ctx-menu').forEach(x=>x.remove());
  const a=el.dataset.act,id=el.dataset.id,ch=el.dataset.ch,b=book(),c=chap();
  // 涟漪
  if(el.classList.contains('iconbtn')||el.classList.contains('btn')){
    const r=document.createElement('span');r.className='ripple';const rc=el.getBoundingClientRect();
    r.style.left=(e.clientX-rc.left)+'px';r.style.top=(e.clientY-rc.top)+'px';
    if(el.classList.contains('iconbtn')||!el.classList.contains('primary'))r.style.background='rgba(120,130,180,.25)';
    el.appendChild(r);setTimeout(()=>r.remove(),650);

  switch(a){
    case 'go':go(el.dataset.view);break;
    case 'toggle-side':openDrawer('side');break;
    case 'toggle-insp':openDrawer('insp');break;
    case 'close-drawers':closeDrawers();break;
    case 'open-book':{
      const t=S.books.find(x=>x.id===id);if(!t)break;
      document.getElementById('globalSearch').value='';document.getElementById('searchPop').innerHTML='';
      S.activeBookId=id;
      if(t.chapters.length)S.activeChapterId=t.chapters.find(c=>c.id===t.lastChapterId)?.id||t.chapters[0].id;
      else S.activeChapterId=null;
      S.ui.view='book';S.ui.bookTab='chapters';S.ui.bookVol='all';
      persist();closeDrawers();renderAll();break;}
    case 'jump':{
      const t=S.books.find(x=>x.id===id);if(!t)break;S.activeBookId=id;S.activeChapterId=ch;S.ui.view='write';
      document.getElementById('globalSearch').value='';document.getElementById('searchPop').innerHTML='';
      persist();renderAll();break;}
    case 'new-book':bookForm(null);break;
    case 'book-settings':{const t=S.books.find(x=>x.id===id)||b;if(t)bookForm(t);break}
    case 'book-menu':{
      e.stopPropagation();const t=S.books.find(x=>x.id===id);if(!t)break;
      popupMenu(el,[{act:'open-book',id,icon:'pen',text:'打开作品'},{act:'book-settings',id,icon:'settings',text:'作品设置'},
        {act:'export-book',id,icon:'dl',text:'导出为 TXT'},{act:'export-md',id,icon:'dl',text:'导出为 Markdown'},
        {act:'export-html',id,icon:'dl',text:'导出为网页'},{act:'del-book',id,icon:'trash',text:'删除作品',danger:true}]);break}
    case 'del-book':{
      const t=S.books.find(x=>x.id===id);if(!t)break;
      confirmBox('删除《'+t.title+'》？','作品及其全部章节、人物与灵感都会被移入回收站章节列表，可恢复部分内容。此操作不可撤销。',()=>{
        (t.chapters||[]).forEach(x=>S.trash.push({...x,bookId:t.id,bookTitle:t.title,deletedAt:Date.now()}));
        S.books=S.books.filter(x=>x.id!==id);
        if(S.activeBookId===id){S.activeBookId=S.books[0]?.id||null;S.activeChapterId=S.books[0]?.chapters[0]?.id||null}
        if(S.ui.view==='book')S.ui.view='shelf';
        document.querySelectorAll('.mask').forEach(x=>x.remove());
        persist();renderAll();toast('作品已删除，章节已移入回收站');});break}
    case 'new-ch':openPrompt('新建章节','章节标题','第 '+(b?b.chapters.length+1:1)+' 章 · ',v=>{

  const t=e.target;
  if(t.id!=='editorText'||!S.settings.pasteTidy)return;
  const txt=(e.clipboardData||window.clipboardData)?.getData('text');
  if(!txt||!/\n/.test(txt))return;
  e.preventDefault();
  const ind=indentText();
  const lines=txt.replace(/\r/g,'').split('\n').map(x=>x.replace(/[ \t\u3000]+$/g,''));
  const out=[];let blank=0;
  lines.forEach(l=>{
    if(!l.trim()){blank++;if(blank<=1)out.push('');return}
    blank=0;out.push(ind+l.replace(/^[\s\u3000]+/,''));
  });
  const s=t.selectionStart,en=t.selectionEnd;
  t.setRangeText(out.join('\n'),s,en,'end');
  onEditorInput(t);requestAnimationFrame(()=>ensureCaretVisible(t));
  toast('已按当前缩进自动排版');
});

/* ==================== 输入法 / 可视区适配 ==================== */
function safeInsetTop(){
  let p=document.getElementById('__sat_probe');
  if(!p){p=document.createElement('div');p.id='__sat_probe';
    p.style.cssText='position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);pointer-events:none;visibility:hidden;z-index:-1';
    document.body.appendChild(p);}
  return Math.round(p.getBoundingClientRect().height)||0;
}
function syncViewport(){
  const vv=window.visualViewport;
  const sat=safeInsetTop();
  const nat=Math.round(window.__MOYU_STATUS_TOP||0);
  const nav=Math.round(window.__MOYU_NAV_BOTTOM||0);
  const h=(vv?Math.round(vv.height):window.innerHeight)-sat-nat-nav;
  const top=(vv?Math.round(vv.offsetTop||0):0)+sat+nat;
  const r=document.documentElement.style;
  r.setProperty('--app-h',h+'px');r.setProperty('--app-top',top+'px');
  const covered=vv?Math.max(0,window.innerHeight-h-top):0;
  document.body.classList.toggle('kb-open',covered>110);
  const ta=document.getElementById('editorText');
  if(ta&&document.activeElement===ta&&document.body.classList.contains('editing'))
    requestAnimationFrame(()=>ensureCaretVisible(ta));
}
function ensureCaretVisible(ta){
  if(!ta||!ta.clientHeight)return;
  const cs=getComputedStyle(ta);
  const lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*2;
  const fs=parseFloat(cs.fontSize)||19;
  const cols=Math.max(8,Math.floor((ta.clientWidth-6)/fs));
  let lines=0;
  ta.value.slice(0,ta.selectionStart).split('\n').forEach(seg=>{lines+=Math.max(1,Math.ceil(seg.length/cols))});
  const y=(lines-1)*lh,top=ta.scrollTop,bot=top+ta.clientHeight;
  if(y<top+lh*1.1)ta.scrollTop=Math.max(0,y-lh*2);
  else if(y>bot-lh*1.6)ta.scrollTop=y-ta.clientHeight+lh*2.2;
}

/* ==================== 版本历史 ==================== */
function snapshot(ch,force=false){
  if(!ch)return;
  ch.history=ch.history||[];
  const now=Date.now(),last=ch.history[0];
  if(!force&&last&&(now-last.t<45000||last.content===ch.content))return;
  ch.history.unshift({t:now,content:String(ch.content||'').slice(0,30000),words:words(ch.content)});
  ch.history=ch.history.slice(0,12);
}
function historyModal(){
  const c=chap();if(!c){toast('先打开一章再看版本','warn');return}
  const list=(c.history||[]).map((h,i)=>`<div class="list-row">
    <span style="color:var(--brand)">${ic('rotate',16)}</span>
    <div class="info"><b>${new Date(h.t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
      ${i===0?' · 最近':''}</b><small>${fmt(h.words)} 字 · ${esc(h.content.replace(/\n/g,' ').slice(0,34))}…</small></div>
    <button class="btn soft sm" data-act="hist-view" data-i="${i}">预览</button>
    <button class="btn soft sm" data-act="hist-restore" data-i="${i}">恢复</button></div>`).join('');
  const m=modal('版本历史',`<p style="font-size:11.5px;color:var(--muted);line-height:1.8;margin:0 0 16px">
      自动保存会每隔一段时间为这一章留一个快照，最多 12 个。恢复前会先把现在的内容也存下来。</p>
    ${list||'<div class="tree-empty">还没有版本<br>点下面「存下当前版本」建立第一个快照</div>'}`,
    `<button class="btn ghost" data-act="hist-save" style="margin-right:auto">${ic('save',14)} 存下当前版本</button>
     <button class="btn primary" data-close>完成</button>`,560);
}
function restoreHistory(i){
  const c=chap();if(!c)return;const h=c.history?.[i];if(!h)return;
  confirmBox('恢复到这个版本？','当前内容会先存成一个新版本，不会丢失。',()=>{
    snapshot(c,true);c.content=h.content;c.updatedAt=Date.now();
    if(book())book().updatedAt=Date.now();
    lastWords=words(c.content);persist();
    document.querySelectorAll('.mask').forEach(x=>x.remove());
    renderEditor();renderTree();renderInspector();toast('已恢复该版本，可在历史里找回刚才的内容');

function tidyModal(){
  if(!chap()){toast('先打开一章再排版','warn');return}
  modal('一键排版',`<p style="font-size:11.5px;color:var(--muted);line-height:1.8;margin:0 0 16px">
      整理前会自动存一个版本，随时可以在「版本历史」里还原。</p>
    <form data-form="tidy">
      <label class="opt-row"><input type="checkbox" name="indent" checked> 统一段首缩进（两个全角空格）</label>
      <label class="opt-row"><input type="checkbox" name="blank" checked> 合并多余空行、清理行尾空格</label>
      <label class="opt-row"><input type="checkbox" name="space"> 中英文之间加一个空格</label>
      <label class="opt-row"><input type="checkbox" name="quote"> 英文直引号转成中文引号</label>
      <div class="mfoot"><button type="button" class="btn ghost" data-close>取消</button>
        <button class="btn primary" type="submit">${ic('spark',15)} 开始整理</button></div></form>`,'',480);
}
function applyTidy(d){
  const ta=document.getElementById('editorText'),c=chap();if(!ta||!c)return;
  snapshot(c,true);
  let lines=ta.value.split('\n').map(l=>l.replace(/[ \t\u3000]+$/g,''));
  if(d.blank){const out=[];let blank=0;
    lines.forEach(l=>{if(!l.trim()){blank++;if(blank<=1)out.push('')}else{blank=0;out.push(l)}});lines=out}
  if(d.indent)lines=lines.map(l=>l.trim()?`　　${l.replace(/^[\s\u3000]+/,'')}`:l);
  if(d.space)lines=lines.map(l=>l
    .replace(/([\u3400-\u4dbf\u4e00-\u9fff])([A-Za-z0-9])/g,'$1 $2')
    .replace(/([A-Za-z0-9])([\u3400-\u4dbf\u4e00-\u9fff])/g,'$1 $2'));
  if(d.quote){let q=0;lines=lines.map(l=>l.replace(/"/g,()=>{q++;return q%2?'“':'”'}))}
  ta.value=lines.join('\n');onEditorInput(ta);persist();
  document.querySelectorAll('.mask').forEach(x=>x.remove());
  toast('排版完成 · 已自动存一个版本');
}

    closeCmd();
  });
  document.getElementById('modalRoot').appendChild(m);
  const q=m.querySelector('#cmdQ');
  q.addEventListener('input',()=>{CMD_SEL=0;renderCmd(q.value)});
  q.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();CMD_SEL=Math.min(CMD_ITEMS.length-1,CMD_SEL+1);paintCmd()}
    else if(e.key==='ArrowUp'){e.preventDefault();CMD_SEL=Math.max(0,CMD_SEL-1);paintCmd()}
    else if(e.key==='Enter'){e.preventDefault();const it=CMD_ITEMS[CMD_SEL];if(!it)return;
      if(it.kind==='cmd'){markRecent(it.key);runCmd(it.key)}else jumpTo(it.ref);closeCmd()}
  });
  renderCmd('');setTimeout(()=>q.focus(),140);
}
function renderCmd(q){
  const list=document.querySelector('#cmdList');if(!list)return;
  const k=String(q||'').trim().toLowerCase();
  const cmds=COMMANDS.filter(c=>!k||(c.t+c.d+c.g+(c.kc||'')).toLowerCase().includes(k));
  let jumps=[];
  if(k){
    S.books.forEach(b=>b.chapters.forEach(c=>{
      if((c.title+' '+b.title+' '+c.content).toLowerCase().includes(k))jumps.push({b,c});
    }));
    jumps=jumps.slice(0,6);
  }
  const blocks=[];
  if(!k){
    const rec=(S.ui.cmdRecent||[]).map(key=>COMMANDS.find(c=>c.k===key)).filter(Boolean).slice(0,4);
    if(rec.length)blocks.push({g:'最近使用',items:rec.map(c=>({c}))});
  }
  [...new Set(cmds.map(c=>c.g))].forEach(g=>{
    blocks.push({g,items:cmds.filter(c=>c.g===g).map(c=>({c}))});
  });
  if(jumps.length)blocks.push({g:'跳转到章节',items:jumps.map(j=>({j}))});
  let html='',idx=0;CMD_ITEMS=[];
  blocks.forEach(bl=>{
    html+=`<div class="cmd-group">${bl.g}</div>`;
    bl.items.forEach(it=>{
      if(it.j){
        const j=it.j;
        html+=`<div class="cmd-item" data-i="${idx}" data-jump="${j.b.id}|${j.c.id}"><span class="ci">${ic('file',16)}</span>
          <div class="ct"><b>${esc(j.c.title)}</b><small>${esc(j.b.title)} · ${fmt(words(j.c.content))} 字</small></div></div>`;
        CMD_ITEMS.push({kind:'jump',ref:j.b.id+'|'+j.c.id});
      }else{
        const c=it.c;
        html+=`<div class="cmd-item" data-i="${idx}" data-cmd="${c.k}"><span class="ci">${ic(c.i,16)}</span>
          <div class="ct"><b>${esc(c.t)}</b><small>${esc(c.d)}</small></div>${c.kc?`<kbd>${esc(c.kc)}</kbd>`:''}</div>`;
        CMD_ITEMS.push({kind:'cmd',key:c.k});
      }
      idx++;
    });
  });
  if(!html)html='<div class="cmd-empty">没有匹配的功能或章节<br>试试「导出」「纸境」「版本」「符号」</div>';
  list.innerHTML=html;paintCmd();
}
function markRecent(k){
  S.ui.cmdRecent=[k,...(S.ui.cmdRecent||[]).filter(x=>x!==k)].slice(0,6);
  persist();
}
function paintCmd(){
  document.querySelectorAll('.cmd-item').forEach(x=>x.classList.toggle('sel',Number(x.dataset.i)===CMD_SEL));
  const sel=document.querySelector('.cmd-item.sel');sel?.scrollIntoView({block:'nearest'});
}
function jumpTo(ref){
  const [bid,cid]=String(ref).split('|');
  const b=S.books.find(x=>x.id===bid);if(!b)return;
  S.activeBookId=bid;S.activeChapterId=cid;b.lastChapterId=cid;S.ui.view='write';
  persist();closeDrawers();renderAll();
}
function runCmd(k){
  const click=s=>document.querySelector(s)?.click();
  const toWrite=()=>{if(S.ui.view!=='write')go('write')};
  switch(k){
    case 'new-ch':toWrite();click('[data-act=new-ch]');break;
    case 'idea':ideaModal();break;
    case 'tidy':toWrite();tidyModal();break;
    case 'history':toWrite();historyModal();break;
    case 'find':toWrite();click('[data-t=find]');break;
    case 'preview':toWrite();previewChapter();break;
    case 'focus':toWrite();click('[data-t=focus]');break;
    case 'typewriter':toWrite();click('[data-t=typewriter]');break;
    case 'pomo':pomoModal();break;
    case 'quickbook':quickBookModal();break;
    case 'new-book':bookForm(null);break;
    case 'new-vol':toWrite();click('[data-act=new-vol]');break;
    case 'side':toWrite();openDrawer('side');break;
    case 'panel':toWrite();openDrawer('insp');break;
    case 'book-settings':toWrite();click('.tree-label [data-act=book-settings]');break;
    case 'trash':trashModal();break;
    case 'shelf':case 'write':case 'stats':case 'book':go(k);break;
    case 'theme':click('#themeBtn');break;
    case 'shelf-list':case 'shelf-grid':{
      S.settings.shelfMode=k==='shelf-list'?'list':'grid';persist();go('shelf');
      toast(k==='shelf-list'?'已切换：列表书架':'已切换：卡片书架');break}
    case 'ruled':case 'paper':{
      S.settings.pageMode=k==='ruled'?'ruled':'paper';persist();toWrite();renderEditor();
      toast(k==='ruled'?'已切换：横线稿纸':'已切换：白纸卡片');break}
    case 'settings':settingsModal();break;
    case 'import':document.getElementById('fileInput').click();break;
    case 'export-ch':{const c=chap();if(c)download(safeName(c.title)+'.txt',c.title+'\n\n'+outText(c));break}
    case 'export-book':case 'export-md':case 'export-html':{
      const b=book();if(b)exportBook(b,k==='export-md'?'md':k==='export-html'?'html':'txt');break}
    case 'export-all':{
      const txt=S.books.map(b=>`《${b.title}》\n作者：${b.author||'佚名'}\n简介：${b.desc||'—'}\n`+
        b.chapters.map(c=>`\n\n${'='.repeat(10)} ${c.title} ${'='.repeat(10)}\n\n${outText(c)}`).join('\n'))
        .join('\n\n\n'+'━'.repeat(30)+'\n\n\n');
      download('墨屿·全部作品.txt',txt);break}
    /* 第一批新命令 */
    case 'ink-ink':case 'ink-paper':case 'ink-mark':case 'ink-glow':
    case 'ink-sign':case 'ink-habit':case 'ink-texture':case 'ink-cmds':{
      toWrite();inkDock(k==='ink-texture'?'paper':k==='ink-cmds'?'sign':k.slice(4));break}
    case 'rich-preview':toWrite();richPreview();break;
    case 'mark-bold':toWrite();markWrap('**','**','重点');break;
    case 'mark-task':toWrite();markBlock('- [ ] ','待办事项');break;
    case 'mo-ling':{toWrite();click('[data-act=mo-trigger]');break}
    case 'prev-ch':case 'next-ch':{
      toWrite();const b=book();if(!b)break;
      const i=b.chapters.findIndex(x=>x.id===S.activeChapterId),j=i+(k==='next-ch'?1:-1);
      if(j<0){toast('已经是第一章了','warn');break}
      if(j>=b.chapters.length){toast('已经是最后一章了','warn');break}
      pickCh(b.chapters[j].id);toast('已翻到「'+b.chapters[j].title+'」');break}
    case 'to-top':case 'to-bottom':{
      const btn=document.querySelector(`[data-act=${k==='to-top'?'rd-top':'rd-bottom'}]`);
      if(btn){btn.click();break}
      const ta=document.getElementById('editorText');if(!ta)break;
      if(k==='to-top'){ta.scrollTop=0;ta.setSelectionRange(0,0)}
      else{ta.scrollTop=ta.scrollHeight;ta.setSelectionRange(ta.value.length,ta.value.length)}
      ta.focus();updateLineGlow();saveEditorPos();break}
    case 'copy-ch':{const c=chap();if(!c){toast('先打开一章','warn');break}
      navigator.clipboard?.writeText(c.title+'\n\n'+outText(c)).then(()=>toast('本章已复制')).catch(()=>toast('浏览器未允许复制','warn'));break}
    /* 第三批 · 案头工具箱 */
    case 'deck':deckOpen();break;
    case 'proof':toWrite();setTimeout(proofModal,60);break;
    case 'global-find':globalFindModal();break;
    case 'template':toWrite();templateModal();break;
    case 'generator':toWrite();generatorModal('name');break;
    case 'qb-manage':qbManage();break;
    case 'outline-card':toWrite();outlineCard();break;
    case 'lock':toWrite();setTimeout(lockIn,80);break;
    case 'split-caret':toWrite();setTimeout(splitAtCaret,60);break;
    case 'para-up':case 'para-down':case 'para-brush':case 'copy-title':
      toWrite();setTimeout(()=>runDeck(k),60);break;
    /* 第四批 */
    case 'page-world':go('world');break;
    case 'page-ideas':go('ideas');break;
    case 'page-mine':go('mine');break;
    case 'page-sync':go('sync');break;
    case 'cover-workshop':coverWorkshop(book()?.id);break;
    case 'sync-now':syncNow('put');break;
  }
}

/* 启动 */
renderAll();syncBoot();
const fresh=!!S.freshStart;delete S.freshStart;persist();
setTimeout(()=>toast(fresh?'欢迎来到墨屿 ✍️ 书架上只有一本使用指南':'欢迎回来，接着写吧 ✍️'),fresh?700:450);
</script>
