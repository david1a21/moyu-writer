<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墨屿 · 写作台</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#F4F6FC; --surface:#FFFFFF; --surface2:#EEF1F9; --surface3:#F8F9FD;
  --text:#242941; --text2:#5A6280; --muted:#98A0B8; --line:#E8ECF6;
  --brand:#5B6CF9; --brand2:#8C7BF7; --accent:#FF9B6B; --ok:#37C79A; --warn:#FFB84D;
  --shadow:0 18px 48px rgba(45,58,120,.10); --shadow2:0 8px 24px rgba(45,58,120,.08);
  --r:28px; --r2:20px; --r3:14px;
  --edit-font:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  --edit-size:19px; --edit-lh:2.05; --edit-width:820px;
  --rule-line:rgba(120,135,180,.22);
  --sky:linear-gradient(160deg,#4A5578,#2C344C 62%,#1E2538);
  --mtn1:#5D6784; --mtn2:#3A435E;
  --ease:cubic-bezier(.22,.9,.26,1);
}
html[data-theme="night"]{
  --bg:#11131C; --surface:#1B1E2B; --surface2:#242838; --surface3:#202433;
  --text:#ECEFFA; --text2:#A9B1CC; --muted:#727C9C; --line:#2C3245;
  --brand:#7C8BFF; --brand2:#A88CFF; --accent:#FFAF82;
  --shadow:0 18px 48px rgba(0,0,0,.42); --shadow2:0 8px 24px rgba(0,0,0,.30);
  --rule-line:rgba(150,165,215,.11);
  --sky:linear-gradient(160deg,#3A4460,#242B40 62%,#191E2C);
  --mtn1:#4B566F; --mtn2:#2E364A;
}
html[data-theme="paper"]{
  --bg:#EFE7D7; --surface:#FBF6EA; --surface2:#F2E9D6; --surface3:#F7F0E1;
  --text:#463B2E; --text2:#7A6A55; --muted:#A9977C; --line:#E3D7BF;
  --brand:#A56B4A; --brand2:#C48F63; --accent:#D98F5C;
  --shadow:0 18px 44px rgba(104,80,45,.16); --shadow2:0 8px 22px rgba(104,80,45,.12);
  --rule-line:rgba(150,120,80,.28);
  --sky:linear-gradient(160deg,#8A7A62,#5F5445 62%,#453E33);
  --mtn1:#9C8B70; --mtn2:#6E6250;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:14px; overflow:hidden; transition:background .5s,color .5s;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 8% -8%,rgba(91,108,249,.12),transparent 65%),
             radial-gradient(700px 500px at 100% 6%,rgba(255,155,107,.11),transparent 60%);
  transition:background .5s}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
svg{display:block;flex:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box}
::selection{background:rgba(91,108,249,.22)}
.app{position:fixed;left:0;right:0;top:var(--app-top,0px);height:var(--app-h,100%);z-index:1;display:flex;flex-direction:column}

/* ============ 动画 ============ */
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes sweep{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(240%) skewX(-18deg)}}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}
@keyframes ink{from{opacity:0;transform:scale(.4) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes barGrow{from{height:0}to{height:var(--h)}}
.stagger>*{animation:up .55s var(--ease) both;animation-delay:calc(var(--i,0)*65ms)}

/* ============ 顶栏 ============ */
.topbar{height:74px;flex:none;display:flex;align-items:center;gap:18px;padding:0 26px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;gap:11px;min-width:170px;cursor:pointer}
.brand-logo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 8px 20px rgba(91,108,249,.35);
  animation:ink .7s var(--ease) both}
.brand-txt strong{display:block;font-size:16px;letter-spacing:.08em}
.brand-txt small{display:block;color:var(--muted);font-size:10px;letter-spacing:.22em;margin-top:2px}
.navtabs{display:flex;gap:4px;background:var(--surface2);padding:5px;border-radius:999px}
.navtab{padding:9px 18px;border-radius:999px;color:var(--text2);font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:7px;transition:.3s var(--ease);position:relative;overflow:hidden}
.navtab:hover{color:var(--text)}
.navtab.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow2)}
.navtab.on::after{content:"";position:absolute;bottom:3px;left:50%;width:14px;height:3px;border-radius:9px;
  transform:translateX(-50%);background:var(--brand);animation:fade .3s both}
.topbar .grow{flex:1}
.searchbox{position:relative;width:240px}
.searchbox>#searchIcon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);z-index:2;pointer-events:none}
.searchbox input{width:100%;height:40px;border:1px solid var(--line);border-radius:999px;background:var(--surface3);
  padding:0 14px 0 40px;outline:none;transition:.3s;font-size:13px}
.searchbox input:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 12%,transparent);background:var(--surface)}
.search-pop{position:absolute;top:48px;left:0;right:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r2);box-shadow:var(--shadow);padding:8px;max-height:330px;overflow:auto;z-index:40;animation:pop .28s var(--ease) both}
.search-pop:empty{display:none}
.sr{padding:10px 12px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:.2s}
.sr:hover{background:var(--surface2)}
.sr b{display:block;font-size:13px;font-weight:600}
.sr span{display:block;font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.iconbtn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--text2);
  background:var(--surface3);border:1px solid var(--line);transition:.28s var(--ease);position:relative;overflow:hidden;flex:none}
.iconbtn:hover{color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow2);border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.iconbtn.solid{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;box-shadow:0 8px 20px rgba(91,108,249,.3)}
.iconbtn.solid:hover{color:#fff}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);width:18px;height:18px;
  margin:-9px 0 0 -9px;pointer-events:none;animation:ripple .6s ease-out forwards}
.goal-chip{display:flex;align-items:center;gap:9px;padding:5px 14px 5px 6px;border-radius:999px;
  background:var(--surface3);border:1px solid var(--line);cursor:pointer;transition:.3s}
.goal-chip:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.goal-chip .txt{line-height:1.2}
.goal-chip b{display:block;font-size:12px}
.goal-chip small{color:var(--muted);font-size:10px}
.ring{width:34px;height:34px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.ring .bg{stroke:var(--surface2)}
.ring .fg{stroke:var(--brand);transition:stroke-dashoffset .8s var(--ease)}

/* ============ 视图容器 ============ */
main{flex:1;min-height:0;position:relative}
.view{display:none;height:100%;overflow:auto}
.view.on{display:block;animation:up .48s var(--ease) both}
#view-write.on{display:flex;overflow:hidden;animation:none}
.wrap{max-width:1240px;margin:0 auto;padding:34px 30px 60px}
.sec-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sec-head h1{margin:0;font-size:27px;letter-spacing:.02em;font-weight:700}
.sec-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
.sec-head .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;
  font-size:13px;font-weight:600;transition:.3s var(--ease);position:relative;overflow:hidden;white-space:nowrap}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 10px 24px rgba(91,108,249,.28)}
.btn.primary:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(91,108,249,.36)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text2)}
.btn.ghost:hover{color:var(--brand);border-color:var(--brand);transform:translateY(-2px)}
.btn.soft{background:var(--surface2);color:var(--text2)}
.btn.soft:hover{color:var(--brand)}
.btn.sm{padding:8px 14px;font-size:12px}
.chip{padding:6px 13px;border-radius:999px;background:var(--surface2);color:var(--text2);font-size:12px;font-weight:600}

/* ============ 书架 ============ */
.shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:22px}
.book-card{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow2);
  border:1px solid var(--line);cursor:pointer;transition:.42s var(--ease);position:relative;animation:up .6s var(--ease) both}
.book-card:hover{transform:translateY(-9px) rotate(-.5deg);box-shadow:var(--shadow)}
.book-card::after{content:"";position:absolute;top:0;left:0;width:45%;height:100%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:translateX(-150%);opacity:0}
.book-card:hover::after{animation:sweep 1s var(--ease);opacity:1}
.cover{height:186px;position:relative;overflow:hidden;background:var(--g);color:#fff;padding:22px 20px;display:flex;flex-direction:column;justify-content:flex-end}
.cover::before{content:"";position:absolute;left:-40px;top:-70px;width:190px;height:190px;border-radius:50%;border:1px solid rgba(255,255,255,.28)}
.cover::after{content:"";position:absolute;right:-60px;bottom:-90px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.10);animation:floaty 7s ease-in-out infinite}
.cover .spine{position:absolute;left:12px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.3)}
.cover .kicker{position:absolute;top:18px;left:22px;font-size:10px;letter-spacing:.3em;opacity:.8}
.cover h3{position:relative;margin:0 0 6px;font-size:20px;line-height:1.35;letter-spacing:.03em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 12px rgba(0,0,0,.15)}
.cover .by{position:relative;font-size:11px;opacity:.85;letter-spacing:.08em}
.book-meta{padding:16px 18px 18px}
.book-meta .row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}
.book-meta .desc{font-size:12px;color:var(--text2);line-height:1.6;height:38px;overflow:hidden;margin:10px 0 14px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));
  transition:width .9s var(--ease)}
.book-more{position:absolute;right:14px;top:14px;z-index:2;width:30px;height:30px;border-radius:10px;
  display:grid;place-items:center;background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px);transition:.25s}
.book-more:hover{background:rgba(255,255,255,.4);transform:rotate(90deg)}
.new-card{border:2px dashed var(--line);background:transparent;box-shadow:none;display:grid;place-items:center;
  min-height:288px;color:var(--muted);gap:12px;transition:.35s var(--ease)}
.new-card:hover{border-color:var(--brand);color:var(--brand);background:color-mix(in srgb,var(--brand) 4%,transparent);transform:translateY(-6px)}
.new-card .plus{width:54px;height:54px;border-radius:20px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow2)}
.empty-hero{text-align:center;padding:70px 20px}
.empty-hero .orb{width:130px;height:130px;margin:0 auto 26px;border-radius:44px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 24px 60px rgba(91,108,249,.34);animation:floaty 5s ease-in-out infinite}

/* ============ 写作台 ============ */
.side{width:264px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;cursor:pointer;margin-bottom:12px}
.crumb:hover{color:var(--brand)}
.side-head h2{margin:0;font-size:16px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-head .sub{font-size:11px;color:var(--muted);margin-top:5px}
.side-acts{display:flex;gap:8px;padding:12px 16px}
.side-acts .btn{flex:1;padding:9px 8px}
.tree{flex:1;overflow:auto;padding:4px 12px 24px}
.tree-label{font-size:10px;letter-spacing:.2em;color:var(--muted);padding:14px 8px 8px;display:flex;justify-content:space-between;align-items:center}
.tree-label button{color:var(--muted)}
.tree-label button:hover{color:var(--brand)}
.vol{margin:8px 0 4px}
.vol-head{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;font-size:12px;font-weight:700;
  color:var(--text2);cursor:pointer;transition:.25s;user-select:none}
.vol-head:hover{background:var(--surface2);color:var(--brand)}
.vol-head .caret{transition:transform .3s var(--ease)}
.vol.collapsed .caret{transform:rotate(-90deg)}
.ch{display:flex;align-items:center;gap:9px;padding:10px 10px 10px 14px;border-radius:13px;margin:3px 0;
  font-size:13px;color:var(--text2);cursor:pointer;position:relative;transition:.28s var(--ease);user-select:none}
.ch::before{content:"";position:absolute;left:0;top:22%;height:56%;width:3px;border-radius:9px;background:var(--brand);
  transform:scaleY(0);transition:transform .3s var(--ease)}
.ch:hover{background:var(--surface2);color:var(--text);transform:translateX(3px)}
.ch.on{background:color-mix(in srgb,var(--brand) 10%,var(--surface));color:var(--brand);font-weight:600}
.ch.on::before{transform:scaleY(1)}
.ch .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .n{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.ch .dots{opacity:0;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none}
.ch:hover .dots,.ch.on .dots{opacity:1}
.ch .dots:hover{background:var(--surface);color:var(--brand)}
.ch.dragging{opacity:.35}
.ch.drop-before{box-shadow:inset 0 3px 0 var(--brand)}
.vol-head.drop-in{background:color-mix(in srgb,var(--brand) 14%,var(--surface));color:var(--brand)}
.tree-empty{text-align:center;color:var(--muted);font-size:12px;padding:30px 10px;line-height:1.8}

.editor-col{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.editor-top{flex:none;padding:18px 28px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title-input{flex:1;min-width:200px;border:0;background:transparent;outline:none;font-size:23px;font-weight:700;
  letter-spacing:.02em;padding:6px 0;position:relative}
.title-input::placeholder{color:var(--muted)}
.title-underline{height:2px;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:9px;
  transition:width .45s var(--ease);margin-top:-4px}
.title-input:focus~.title-underline{width:100%}
.toolrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:10px 28px 12px;border-bottom:1px solid var(--line)}
.tool{height:32px;min-width:32px;padding:0 9px;border-radius:11px;display:inline-flex;align-items:center;gap:6px;
  color:var(--text2);font-size:12px;transition:.25s var(--ease);border:1px solid transparent}
.tool:hover{background:var(--surface2);color:var(--brand)}
.tool.on{background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand);border-color:color-mix(in srgb,var(--brand) 22%,transparent)}
.tool-sep{width:1px;height:18px;background:var(--line);margin:0 5px}
.select{height:32px;border-radius:11px;border:1px solid var(--line);background:var(--surface3);padding:0 8px;
  outline:none;font-size:12px;color:var(--text2)}
.findbar{display:none;align-items:center;gap:8px;padding:10px 28px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;animation:up .3s var(--ease) both}
.findbar.on{display:flex}
.findbar input{height:32px;border:1px solid var(--line);background:var(--surface3);border-radius:11px;padding:0 12px;outline:none;font-size:12px;width:170px}
.findbar input:focus{border-color:var(--brand)}
.findbar .cnt{font-size:11px;color:var(--muted)}
.paper-scroll{flex:1;overflow:auto;padding:26px 28px 40px;display:flex;justify-content:center}
.paper{width:100%;max-width:var(--edit-width);background:var(--surface);border-radius:var(--r);
  box-shadow:var(--shadow);padding:46px 56px 40px;position:relative;transition:box-shadow .5s,max-width .5s var(--ease),padding .5s var(--ease);
  animation:up .55s var(--ease) both;border:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.paper::before{content:"";position:absolute;left:50%;top:20px;transform:translateX(-50%);width:44px;height:4px;border-radius:99px;background:var(--line)}
.paper:focus-within{box-shadow:0 24px 64px rgba(45,58,120,.16)}
#editorText{display:block;width:100%;flex:1;height:auto;min-height:340px;border:0;outline:none;resize:none;
  background:transparent;color:var(--text);font-family:var(--edit-font);font-size:var(--edit-size);
  line-height:var(--edit-lh);letter-spacing:.02em;caret-color:var(--brand);overflow-y:auto}
#editorText::placeholder{color:var(--muted);font-style:italic}
.paper-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:16px;margin-top:14px;border-top:1px dashed var(--line);
  font-size:11px;color:var(--muted)}
.paper-foot b{color:var(--text2);font-variant-numeric:tabular-nums}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 2s infinite}
.save-dot.writing{background:var(--warn)}
.statusbar{flex:none;height:38px;display:flex;align-items:center;gap:16px;padding:0 28px;border-top:1px solid var(--line);
  background:var(--surface);font-size:11px;color:var(--muted)}
.statusbar .grow{flex:1}
.statusbar b{color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums}

.inspector{width:290px;flex:none;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.itabs{display:flex;gap:2px;padding:14px 14px 0}
.itab{flex:1;padding:9px 0;text-align:center;border-radius:11px;font-size:12px;font-weight:600;color:var(--muted);transition:.28s}
.itab:hover{color:var(--text2);background:var(--surface3)}
.itab.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.ibody{flex:1;overflow:auto;padding:16px 16px 30px;animation:fade .3s both}
.ibody h4{margin:16px 0 9px;font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:700}
.ta{width:100%;border:1px solid var(--line);background:var(--surface3);border-radius:var(--r3);padding:12px 14px;
  outline:none;resize:vertical;font-size:12.5px;line-height:1.8;min-height:150px;transition:.3s}
.ta:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 9%,transparent)}
.note-card{border-radius:var(--r3);padding:13px 14px;margin-bottom:10px;background:var(--surface3);border:1px solid var(--line);
  position:relative;transition:.3s var(--ease);animation:up .4s var(--ease) both}
.note-card:hover{transform:translateX(-3px);box-shadow:var(--shadow2)}
.note-card .x{position:absolute;right:8px;top:8px;color:var(--muted);opacity:0;transition:.2s}
.note-card:hover .x{opacity:1}
.note-card .x:hover{color:#F26D6D}
.note-card b{font-size:13px;display:block;margin-bottom:4px}
.note-card small{font-size:11px;color:var(--muted);display:block;line-height:1.6;white-space:pre-wrap}
.note-card.char{border-left:3px solid var(--brand)}
.note-card.idea{background:linear-gradient(135deg,rgba(255,184,77,.12),rgba(255,155,107,.07));border-color:rgba(255,155,107,.25)}
.quick-add{display:flex;gap:8px;margin-bottom:14px}
.quick-add input{flex:1;min-width:0;height:36px;border:1px solid var(--line);background:var(--surface3);border-radius:12px;padding:0 12px;outline:none;font-size:12px}
.quick-add input:focus{border-color:var(--brand)}
.mini-stat{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line);font-size:12px}
.mini-stat b{font-size:15px;font-variant-numeric:tabular-nums}
.pomo{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 10%,var(--surface)),var(--surface));
  border-radius:var(--r2);padding:16px;text-align:center;border:1px solid var(--line);margin-top:14px}
.pomo .time{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;margin:8px 0}
.pomo .row{display:flex;justify-content:center;gap:8px}

/* ============ 统计 ============ */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow2);
  position:relative;overflow:hidden;transition:.35s var(--ease)}
.stat-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.stat-card .ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand2));margin-bottom:16px}
.stat-card:nth-child(2) .ico{background:linear-gradient(135deg,#FF9B6B,#FFC978)}
.stat-card:nth-child(3) .ico{background:linear-gradient(135deg,#37C79A,#7BE0B8)}
.stat-card:nth-child(4) .ico{background:linear-gradient(135deg,#8C7BF7,#C69BFF)}
.stat-card .v{font-size:29px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat-card .k{font-size:12px;color:var(--muted);margin-top:5px}
.stat-card .glow{position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:color-mix(in srgb,var(--brand) 9%,transparent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow2);margin-bottom:20px}
.panel h3{margin:0 0 4px;font-size:16px}
.panel .hint{font-size:11px;color:var(--muted);margin-bottom:20px}
.chart{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart .bar2{width:100%;max-width:38px;border-radius:10px 10px 6px 6px;
  background:linear-gradient(180deg,var(--brand),var(--brand2));height:var(--h);min-height:3px;
  animation:barGrow .8s var(--ease) both;animation-delay:calc(var(--i,0)*45ms);position:relative;transition:filter .3s}
.chart .bar2:hover{filter:brightness(1.15)}
.chart .bar2.zero{background:var(--surface2)}
.chart .lb{font-size:10px;color:var(--muted);white-space:nowrap}
.chart .vl{font-size:10px;color:var(--text2);font-variant-numeric:tabular-nums}
.book-progress{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.book-progress:last-child{border:0}
.book-progress .dot{width:36px;height:36px;border-radius:12px;flex:none}
.book-progress .info{flex:1;min-width:0}
.book-progress .info b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-progress .info small{color:var(--muted);font-size:11px}
.book-progress .bar{width:130px;flex:none}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--surface2);transition:.3s}
.heat i:hover{transform:scale(1.25)}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{padding:10px 14px;border-radius:14px;background:var(--surface3);border:1px solid var(--line);font-size:12px;
  display:flex;align-items:center;gap:8px;transition:.3s}
.badge.locked{opacity:.4;filter:grayscale(1)}
.badge:hover{transform:translateY(-3px)}

/* ============ 模态 / 提示 ============ */
.mask{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:20px;
  background:rgba(22,26,48,.42);backdrop-filter:blur(9px);animation:fade .25s both}
.mask.closing{animation:fade .2s reverse both}
.modal{width:100%;max-width:470px;max-height:86vh;overflow:auto;background:var(--surface);border-radius:var(--r);
  box-shadow:0 30px 90px rgba(20,25,60,.3);border:1px solid var(--line);animation:pop .38s var(--ease) both;padding:26px}
.modal h3{margin:0 0 6px;font-size:19px}
.modal .mh{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}
.modal .mh p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:7px;font-weight:600}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface3);
  border-radius:14px;padding:11px 14px;outline:none;font-size:13px;transition:.3s}
.field textarea{resize:vertical;min-height:80px;line-height:1.7}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);background:var(--surface);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 10%,transparent)}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.covers{display:flex;gap:10px;flex-wrap:wrap}
.covers label{width:44px;height:44px;border-radius:14px;cursor:pointer;position:relative;transition:.25s;background:var(--g)}
.covers input{display:none}
.covers label:has(input:checked){outline:3px solid var(--brand);outline-offset:3px;transform:scale(1.06)}
.theme-picks{display:flex;gap:10px}
.theme-picks label{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer;font-size:12px;transition:.25s}
.theme-picks input{display:none}
.theme-picks label:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surface));color:var(--brand);font-weight:700}
.theme-picks .sw{height:26px;border-radius:8px;margin-bottom:8px}
.mode-picks label{padding:11px 6px}
.list-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface3);margin-bottom:9px}
.list-row .info{flex:1;min-width:0}
.list-row b{font-size:13px;display:block}
.list-row small{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.danger{color:#EF6A6A}
.toast-stack{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;display:flex;
  flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;
  padding:12px 16px;font-size:12.5px;display:flex;align-items:center;gap:9px;animation:toastIn .4s var(--ease) both;max-width:340px;pointer-events:auto}
.toast svg{color:var(--ok)}
.toast.out{animation:toastIn .3s reverse both}
.focus-fab{position:fixed;right:24px;bottom:24px;z-index:60;display:none;gap:8px;align-items:center;padding:12px 18px;
  border-radius:999px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);font-size:12px;color:var(--text2)}
body.focus .focus-fab{display:flex;animation:up .4s both}
body.focus .topbar,body.focus .side,body.focus .inspector,body.focus .statusbar{display:none}
body.focus .paper{max-width:880px;padding:60px 72px}
body.focus #editorText{flex:1;height:auto;min-height:0}
body.focus .editor-top,body.focus .toolrow{opacity:.25;transition:opacity .4s}
body.focus .editor-col:hover .editor-top,body.focus .editor-col:hover .toolrow{opacity:1}
.side-toggle,.panel-toggle,.panel-jump{display:none}
@media(min-width:901px){[data-t=panel]{display:none}}

/* ============ 响应式 ============ */
@media(max-width:1120px){.inspector{width:252px}.side{width:230px}.searchbox{width:180px}}
@media(max-width:900px){
  .topbar{height:64px;padding:0 14px;gap:10px}
  .navtabs{display:none}
  .sync-status span{display:none}.sync-status{padding:8px;width:34px;justify-content:center}
  .brand{min-width:auto}.brand-txt{display:none}
  .navtab{padding:9px 12px;font-size:0;gap:0}.navtab svg{width:19px;height:19px}
  .searchbox{width:40px;height:40px;border-radius:14px;background:var(--surface3);border:1px solid var(--line)}
  .searchbox input{width:100%;height:38px;padding:0;border:0;background:transparent;color:transparent;cursor:pointer}
  .searchbox input::placeholder{color:transparent}
  .searchbox input:focus{width:220px;height:40px;position:absolute;right:0;top:0;z-index:3;background:var(--surface);
    border:1px solid var(--brand);border-radius:14px;padding:0 12px 0 38px;color:var(--text);box-shadow:var(--shadow);cursor:text}
  .searchbox input:focus::placeholder{color:var(--muted)}
  .searchbox>#searchIcon{left:11px}
  .searchbox:focus-within #searchIcon{transform:translate(-180px,-50%)}
  .goal-chip .txt{display:none}.goal-chip{padding:4px}
  .topbar .iconbtn.opt{display:none}
  .wrap{padding:22px 16px 50px}
  .sec-head{gap:10px;margin-bottom:20px}
  .sec-head h1{font-size:22px}
  .sec-head .btn{padding:9px 13px;font-size:12px}
  .tool b{white-space:nowrap}
  .iconbtn:focus{outline:none}
  .shelf-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  .cover{height:150px;padding:16px}.cover h3{font-size:16px}
  .topbar{z-index:60}
  .side,.inspector{position:fixed;top:64px;bottom:0;z-index:55;width:280px;box-shadow:var(--shadow);transition:transform .4s var(--ease)}
  .side{left:0;transform:translateX(-105%)}.side.open{transform:none}
  .inspector{right:0;transform:translateX(105%);border-left:1px solid var(--line)}.inspector.open{transform:none}
  .side-toggle,.panel-toggle,.panel-jump{display:grid}
  .editor-top{padding:12px 14px 0}.title-input{font-size:21px}
  .toolrow{padding:8px 12px 8px;gap:2px;flex-wrap:nowrap;overflow-x:auto}
  .findbar{padding:9px 12px}
  /* 手机端纸面几乎铺满：正文栏更宽，编辑区用 flex 撑满剩余高度 */
  .paper-scroll{padding:10px 8px 16px;align-items:stretch}
  .paper{max-width:100%;padding:22px 15px 14px;border-radius:20px;
    display:flex;flex-direction:column;min-height:0}
  .paper::before{top:9px;width:36px}
  #editorText{flex:1;height:auto;min-height:0;font-size:calc(var(--edit-size) + 1px);letter-spacing:0}
  .paper-foot{margin-top:10px;padding-top:12px;gap:10px}
  /* 专注模式不再套用桌面的 880px / 72px 大留白 */
  body.focus .paper-scroll{padding:8px 8px 14px}
  body.focus .paper{max-width:100%;padding:24px 15px 14px}
  body.focus #editorText{height:auto;flex:1;min-height:0}
  body.focus .editor-top,body.focus .toolrow,
  body.focus .editor-col:hover .editor-top,body.focus .editor-col:hover .toolrow{opacity:1}
  body.focus .focus-fab{top:12px;right:12px;bottom:auto;left:auto;padding:9px 12px;
    border-radius:999px;font-size:11px;gap:6px;opacity:.95}
  body.on-book .toast-stack{bottom:78px}
  .statusbar{height:34px;padding:0 14px;gap:10px}
  .statusbar .hide-sm{display:none}
  .overlay{position:fixed;inset:64px 0 0;background:rgba(20,24,45,.4);z-index:44;animation:fade .25s both}
  .heat{grid-template-columns:repeat(10,1fr)}
}
@media(max-width:520px){
  .topbar{gap:6px;padding:0 10px}.goal-chip,#pomoBtn,.panel-toggle{display:none}
  .navtab{padding:9px}.brand-logo{width:34px;height:34px;border-radius:12px}
  .paper-scroll{padding:8px 6px 14px}
  .paper{padding:20px 13px 12px;border-radius:18px}
  body.focus .paper{padding:22px 11px 12px}
  .panel{padding:18px}.chart{gap:5px}.chart .lb{font-size:8px}
  .modal{padding:20px;border-radius:22px}
  .toast-stack{left:12px;right:12px;bottom:14px;transform:none;align-items:center}.toast{max-width:none}
  .book-progress .bar{width:70px}
  .cmd-mask{padding-top:7vh}
  .cmd{max-height:82vh}
}

/* ============ 输入法 / 键盘态 ============ */
body.editing .paper-foot,body.editing .statusbar{display:none}
body.editing .paper-scroll{padding-bottom:8px}
body.kb-open .mask{place-items:start center;padding-top:10px;padding-bottom:10px}
body.kb-open .modal{max-height:calc(var(--app-h,100vh) - 20px)}
body.kb-open .cmd-mask{align-items:flex-start;padding-top:10px}
body.kb-open .cmd{max-height:calc(var(--app-h,100vh) - 20px)}
body.kb-open .toast-stack{bottom:auto;top:calc(var(--app-h,100vh) - 58px)}
body.kb-open .editor-top{padding-top:6px}
body.kb-open .title-input{font-size:17px;padding:2px 0}
body.kb-open .toolrow{padding-top:5px;padding-bottom:5px}
body.kb-open .paper-scroll{padding-top:6px;padding-bottom:6px}
body.kb-open .paper{padding-top:14px}

/* ============ 命令面板 ============ */
.cmd-mask{position:fixed;inset:0;z-index:96;background:rgba(22,26,48,.46);backdrop-filter:blur(10px);
  display:flex;justify-content:center;align-items:flex-start;padding:9vh 16px 16px;animation:fade .22s both}
.cmd{width:100%;max-width:580px;max-height:76vh;background:var(--surface);border:1px solid var(--line);
  border-radius:26px;box-shadow:0 30px 90px rgba(20,25,60,.32);overflow:hidden;display:flex;flex-direction:column;
  animation:pop .34s var(--ease) both}
.cmd-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);color:var(--brand)}
.cmd-head input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;color:var(--text)}
.cmd-head input::placeholder{color:var(--muted)}
kbd{font:11px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--muted);background:var(--surface3);
  border:1px solid var(--line);border-radius:7px;padding:3px 7px;white-space:nowrap}
.cmd-list{overflow:auto;padding:8px;flex:1;min-height:0}
.cmd-group{font-size:10px;letter-spacing:.18em;color:var(--muted);padding:13px 12px 5px;font-weight:700}
.cmd-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;cursor:pointer;transition:.18s var(--ease)}
.cmd-item:hover,.cmd-item.sel{background:color-mix(in srgb,var(--brand) 11%,var(--surface))}
.cmd-item .ci{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;
  background:var(--surface2);color:var(--brand);flex:none}
.cmd-item.sel .ci{background:var(--brand);color:#fff}
.cmd-item .ct{flex:1;min-width:0}
.cmd-item b{display:block;font-size:13px;font-weight:600}
.cmd-item small{display:block;color:var(--muted);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-foot{padding:10px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.cmd-empty{text-align:center;color:var(--muted);font-size:12px;padding:34px 10px}

/* ============ 灵感 / 片段 / 历史 ============ */
.idea-tabs{display:flex;gap:6px;margin-bottom:14px}
.idea-tab{flex:1;padding:9px 4px;border-radius:12px;font-size:12px;font-weight:600;color:var(--muted);
  background:var(--surface3);transition:.25s var(--ease)}
.idea-tab:hover{color:var(--text2)}
.idea-tab.on{background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 20%,transparent)}
.idea-box{width:100%;border:1px solid var(--line);background:var(--surface3);border-radius:16px;padding:13px 15px;
  outline:none;resize:vertical;font-size:13.5px;line-height:1.9;min-height:88px;transition:.3s;color:var(--text)}
.idea-box:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 9%,transparent)}
.prompt-card{border-radius:18px;padding:18px;background:linear-gradient(135deg,
  color-mix(in srgb,var(--brand) 11%,var(--surface)),color-mix(in srgb,var(--accent) 10%,var(--surface)));
  border:1px solid var(--line);margin-bottom:14px;min-height:84px;display:flex;align-items:center;
  font-size:14.5px;line-height:1.9;position:relative}
.prompt-card .q{position:absolute;right:12px;top:8px;font-size:30px;opacity:.16;font-family:serif}
.mini-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--surface3);
  margin-bottom:8px;transition:.25s var(--ease);border:1px solid transparent}
.mini-row:hover{border-color:var(--line);transform:translateX(2px)}
.mini-row .t{flex:1;min-width:0;font-size:12.5px;line-height:1.6;color:var(--text2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row .sub{font-size:10px;color:var(--muted);margin-top:3px}
.mini-row .go{color:var(--brand);opacity:0;transition:.2s}
.mini-row:hover .go{opacity:1}
.opt-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;background:var(--surface3);
  margin-bottom:8px;font-size:12.5px;cursor:pointer;transition:.25s}
.opt-row:hover{background:color-mix(in srgb,var(--brand) 7%,var(--surface3))}
.opt-row input{width:16px;height:16px;accent-color:var(--brand)}
.hist-line{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.target-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  background:var(--surface3);color:var(--text2);font-size:11px;transition:.25s}
.target-chip:hover{color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--surface3))}
.target-chip .bar{width:52px;height:4px}

/* ============ 书籍目录页 ============ */
#view-book.on{display:flex;flex-direction:column;overflow:hidden;animation:none}
.book-page{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;max-width:1240px;width:100%;margin:0 auto}
.bk-head{flex:none;display:flex;align-items:center;gap:14px;padding:16px 30px 12px}
.bk-back{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;color:var(--text2);
  background:var(--surface3);border:1px solid var(--line);transition:.28s var(--ease);flex:none}
.bk-back:hover{color:var(--brand);transform:translateX(-3px)}
.bk-head .ht{flex:1;min-width:0}
.bk-head h1{margin:0;font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-head .sync{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px}
.bk-head .sync b{color:var(--ok);font-weight:600}
.bk-search{display:none;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:13px;
  background:var(--surface3);border:1px solid var(--line);animation:up .3s var(--ease) both}
.bk-search.on{display:flex}
.bk-search input{border:0;background:transparent;outline:none;font-size:12px;width:150px}
.bk-scroll{flex:1;min-height:0;overflow:auto;padding:0 30px 24px;display:flex;flex-direction:column}
.bk-scroll>*{flex:none}
body.on-book .toast-stack{bottom:92px}
.bk-card{display:flex;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:18px 22px;box-shadow:var(--shadow2);margin:6px 0 24px;
  animation:up .5s var(--ease) both;position:relative;overflow:hidden}
.bk-cover{width:92px;height:124px;border-radius:15px;flex:none;position:relative;overflow:hidden;
  background:var(--g);box-shadow:0 10px 24px rgba(0,0,0,.18);display:flex;align-items:flex-start;
  justify-content:center;padding-top:14px;color:rgba(255,255,255,.92);font-size:11px;line-height:1.5;text-align:center;font-weight:600}
.bk-cover::before{content:"";position:absolute;left:18px;top:52px;width:16px;height:16px;border-radius:50%;
  background:rgba(255,225,170,.95);box-shadow:0 0 14px rgba(255,225,170,.55)}
.bk-cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.18));
  clip-path:polygon(0 100%,0 62%,26% 24%,48% 66%,68% 32%,100% 74%,100% 100%)}
.bk-info{flex:1;min-width:0}
.bk-info h2{margin:0 0 8px;font-size:20px;line-height:1.3}
.bk-info .line{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;color:var(--text2);line-height:1.9}
.bk-info .line span{color:var(--muted)}
.bk-info .desc{font-size:12px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-info .bar{margin-top:12px;max-width:330px}
.bk-card .edit{position:absolute;right:18px;bottom:18px}
.bk-split{display:flex;gap:0;flex:1;min-height:340px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow2);animation:up .55s var(--ease) both}
.bk-vols{width:230px;flex:none;border-right:1px solid var(--line);padding:14px 10px;background:var(--surface3)}
.bk-vols .lab{font-size:10px;letter-spacing:.18em;color:var(--muted);padding:4px 10px 12px;font-weight:700}
.bk-vol{padding:12px 12px;border-radius:14px;cursor:pointer;transition:.28s var(--ease);margin-bottom:4px}
.bk-vol:hover{background:var(--surface2)}
.bk-vol.on{background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand)}
.bk-vol b{display:block;font-size:14px;font-weight:600;line-height:1.4}
.bk-vol small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.bk-vol.on small{color:var(--brand);opacity:.75}
.bk-vol-add{width:100%;margin-top:8px;padding:9px;border-radius:12px;border:1px dashed var(--line);
  color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.25s}
.bk-vol-add:hover{color:var(--brand);border-color:var(--brand);background:color-mix(in srgb,var(--brand) 5%,transparent)}
.bk-chs{flex:1;min-width:0;padding:8px 8px 76px}
.bk-ch{display:flex;align-items:center;gap:12px;padding:15px 14px;border-radius:14px;cursor:pointer;
  transition:.28s var(--ease);position:relative;border-bottom:1px solid var(--line)}
.bk-ch:last-of-type{border-bottom:0}
.bk-ch:hover{background:var(--surface2);transform:translateX(3px)}
.bk-ch.on{background:color-mix(in srgb,var(--brand) 9%,var(--surface))}
.bk-ch .t{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:center;gap:7px}
.bk-ch.on .t{color:var(--brand);font-weight:600}
.bk-ch.empty .t{color:var(--muted)}
.bk-ch .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bk-ch.on .n{color:var(--brand)}
.bk-ch .dots{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted);
  opacity:0;transition:.2s;flex:none}
.bk-ch:hover .dots,.bk-ch.on .dots{opacity:1}
.bk-ch .dots:hover{background:var(--surface);color:var(--brand)}
.bk-ch .tag{font-size:10px;padding:2px 7px;border-radius:7px;background:var(--surface2);color:var(--muted)}
.bk-add-ch{width:100%;margin-top:12px;padding:13px;border-radius:14px;border:1px dashed var(--line);
  color:var(--muted);font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:7px;transition:.28s var(--ease)}
.bk-add-ch:hover{color:var(--brand);border-color:var(--brand);background:color-mix(in srgb,var(--brand) 5%,transparent)}
.bk-empty{text-align:center;color:var(--muted);font-size:12.5px;padding:56px 16px;line-height:2}
.fab{position:absolute;right:26px;bottom:26px;width:58px;height:58px;border-radius:50%;
  display:grid;place-items:center;color:#fff;background:var(--brand);
  box-shadow:0 14px 32px color-mix(in srgb,var(--brand) 45%,transparent);z-index:8;
  transition:.35s var(--ease);animation:ink .55s var(--ease) both}
.fab:hover{transform:translateY(-5px) rotate(90deg);box-shadow:0 20px 42px color-mix(in srgb,var(--brand) 52%,transparent)}
.fab:active{transform:scale(.9)}
.book-page>.fab{bottom:88px}
.fab.shelf-fab{position:fixed;right:26px;bottom:26px;display:none}
.bk-tabs{flex:none;display:flex;align-items:center;gap:4px;padding:8px 22px 10px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);z-index:6}
.bk-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:14px;
  color:var(--muted);font-size:11px;font-weight:600;transition:.3s var(--ease);position:relative}
.bk-tab:hover{color:var(--text2)}
.bk-tab.on{color:var(--brand)}
.bk-tab.on::before{content:"";position:absolute;top:-9px;width:22px;height:3px;border-radius:9px;
  background:var(--brand);animation:fade .3s both}
.bk-tab.on svg{transform:translateY(-2px)}
.bk-tab svg{transition:transform .3s var(--ease)}
.bk-panel{max-width:900px;width:100%;margin:0 auto;padding:2px 0 20px;animation:up .4s var(--ease) both}
.bk-panel h3{margin:20px 0 10px;font-size:13px;letter-spacing:.04em}
.bk-panel .hint{font-size:11px;color:var(--muted);margin:0 0 12px;line-height:1.8}
.bk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bk-note{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 17px;
  box-shadow:var(--shadow2);transition:.3s var(--ease);animation:up .45s var(--ease) both;position:relative}
.bk-note:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.bk-note b{font-size:13.5px;display:block;margin-bottom:6px}
.bk-note small{font-size:11px;color:var(--muted);display:block;line-height:1.75;white-space:pre-wrap}
.bk-note .acts{display:flex;gap:7px;margin-top:12px}
.bk-note .x{position:absolute;right:10px;top:10px;color:var(--muted);opacity:0;transition:.2s}
.bk-note:hover .x{opacity:1}
.bk-note .x:hover{color:#EF6A6A}
.bk-set{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bk-set div{background:var(--surface3);border-radius:14px;padding:13px 15px;font-size:12px;color:var(--muted)}
.bk-set b{display:block;font-size:16px;color:var(--text);margin-top:5px;font-variant-numeric:tabular-nums}
.bk-big-ta{width:100%;min-height:260px;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r);padding:20px 22px;outline:none;resize:vertical;font-size:14px;line-height:2;
  color:var(--text);box-shadow:var(--shadow2);transition:.3s}
.bk-big-ta:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 9%,transparent)}
.bk-quick{display:flex;gap:9px;margin-bottom:12px}
.bk-quick input{flex:1;min-width:0;height:42px;border:1px solid var(--line);background:var(--surface);
  border-radius:14px;padding:0 15px;outline:none;font-size:13px;box-shadow:var(--shadow2);transition:.3s}
.bk-quick input:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 9%,transparent)}
.bk-vol-outline{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:11px;
  box-shadow:var(--shadow2)}
.bk-vol-outline b{font-size:13px;display:block;margin-bottom:9px}
.bk-vol-outline textarea{width:100%;min-height:66px;border:1px solid var(--line);background:var(--surface3);
  border-radius:12px;padding:10px 12px;outline:none;resize:vertical;font-size:12.5px;line-height:1.8}
.bk-vol-outline textarea:focus{border-color:var(--brand)}

@media(max-width:900px){
  .bk-head{padding:12px 16px 10px;gap:8px}
  .bk-head h1{font-size:17px}
  .bk-head .sync{font-size:10.5px;white-space:nowrap}

  .bk-info h2{font-size:17px}
  .bk-info .line{gap:12px;font-size:11px}
  .bk-card .edit{right:12px;bottom:12px}
  .bk-split{flex-direction:column;border-radius:22px;min-height:0}
  .bk-vols{width:100%;border-right:0;border-bottom:1px solid var(--line);padding:10px;

  .bk-vols .lab,.bk-vol-add{display:none}
  .bk-vol{flex:none;min-width:104px;margin:0;padding:9px 12px;border:1px solid var(--line);background:var(--surface)}
  .bk-vol.on{border-color:var(--brand)}
  .bk-vol b{font-size:12px;white-space:nowrap}
  .bk-vol small{font-size:10px;margin-top:2px}
  .bk-chs{padding:4px 4px 10px}
  .bk-ch{padding:13px 10px}
  .bk-ch .tag{display:none}
  .bk-ch .dots{opacity:1}
  .bk-info .bar{max-width:calc(100% - 52px)}
  body.on-book .toast-stack{left:12px;right:84px;align-items:flex-start}
  .bk-card .edit span{display:none}
  .bk-card .edit{padding:8px;width:34px;height:34px;right:12px;bottom:12px}
  .book-page>.fab{right:18px;bottom:76px;width:54px;height:54px}

  .bk-tab svg{width:20px;height:20px}

}

  .bk-info .desc{display:none}
  .bk-info .line{gap:9px}
  .bk-info .bar{margin-top:8px}

/* ============ 列表式书架 ============ */
.shelf-list{max-width:920px;margin:0 auto;padding-bottom:20px}
.sl-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;animation:up .5s var(--ease) both}
.sl-head .ht{flex:1;min-width:0}
.sl-head h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.01em;
  background:linear-gradient(120deg,var(--text),var(--brand) 78%,var(--brand2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sl-head .sync{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;margin-top:7px}
.sl-head .sync b{color:var(--ok);font-weight:600}
.sl-head .sync i{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 2.4s infinite}
.sl-head .acts{display:flex;gap:7px;flex:none}
.sl-head .acts .iconbtn{width:38px;height:38px;border-radius:13px}
.sl-filters{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;animation:up .5s var(--ease) both;animation-delay:60ms}
.sl-f{flex:1;display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:999px;max-width:300px}
.sl-f button{flex:1;padding:8px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);transition:.3s var(--ease)}
.sl-f button:hover{color:var(--text2)}
.sl-f button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow2)}
.sl-tools{display:flex;gap:7px}
.sl-mode{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--muted);
  background:var(--surface3);border:1px solid var(--line);transition:.28s var(--ease)}
.sl-mode:hover{color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow2)}
.sl-mode.on{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 30%,var(--line))}
.sl-search{display:none;align-items:center;gap:9px;padding:0 14px;height:44px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow2);margin-bottom:14px;
  animation:up .3s var(--ease) both}
.sl-search.on{display:flex}
.sl-search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:13px}
.sl-items{display:flex;flex-direction:column;gap:12px}
.sl-item{display:flex;gap:17px;align-items:center;padding:15px 17px;border-radius:24px;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 16px rgba(45,58,120,.045);
  cursor:pointer;position:relative;overflow:hidden;transition:.38s var(--ease);
  animation:up .55s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
.sl-item::before{content:"";position:absolute;left:0;top:18%;height:64%;width:3px;border-radius:0 9px 9px 0;
  background:linear-gradient(180deg,var(--brand),var(--brand2));opacity:0;transition:opacity .3s}
.sl-item::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.13) 50%,transparent 70%);transform:translateX(-120%)}
.sl-item:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--brand) 22%,var(--line))}
.sl-item:hover::before{opacity:1}
.sl-item:hover::after{opacity:1;animation:sweep .9s var(--ease)}
.sl-item:active{transform:scale(.992)}
.mini-cover{width:76px;height:104px;flex:none;border-radius:13px;position:relative;overflow:hidden;
  background:var(--sky);box-shadow:0 8px 20px rgba(10,14,30,.28);
  display:flex;justify-content:center;padding-top:12px;color:rgba(255,255,255,.94);
  font-size:9.5px;line-height:1.45;text-align:center;font-weight:600;letter-spacing:.02em}
.mini-cover .mc-t{position:relative;z-index:3;max-width:64px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.mini-cover::before{content:"";position:absolute;z-index:2;left:14px;top:34px;width:15px;height:15px;border-radius:50%;
  background:#FFE7B0;box-shadow:0 0 0 4px rgba(255,225,165,.14),0 0 18px 6px rgba(255,220,150,.35);animation:floaty 6s ease-in-out infinite}
.mini-cover::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent 50%,color-mix(in srgb,var(--mtn2) 30%,transparent) 100%)}
.mini-cover .ridge{position:absolute;inset:0;z-index:1;pointer-events:none}
.mini-cover .ridge::before{content:"";position:absolute;left:0;right:0;bottom:0;height:44%;
  background:var(--mtn2);clip-path:polygon(0 100%,0 60%,22% 20%,42% 62%,63% 26%,82% 58%,100% 38%,100% 100%)}
.mini-cover .ridge::after{content:"";position:absolute;left:0;right:0;bottom:0;height:31%;
  background:var(--mtn1);clip-path:polygon(0 100%,0 52%,26% 14%,52% 66%,74% 30%,100% 62%,100% 100%);opacity:.92}
.mini-cover .star{position:absolute;z-index:1;width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,.55)}
.sl-info{flex:1;min-width:0}
.sl-info h3{margin:0 0 7px;font-size:16.5px;font-weight:700;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-info .meta{font-size:12px;color:var(--text2);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.sl-info .meta em{font-style:normal;color:var(--muted)}
.sl-info .last{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:11.5px;color:var(--muted)}
.sl-info .last .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.sl-info .last time{flex:none;font-variant-numeric:tabular-nums}
.sl-prog{height:3px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px;max-width:250px}
.sl-prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));
  transition:width .9s var(--ease)}
.sl-more{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--muted);
  align-self:flex-start;flex:none;transition:.25s}
.sl-more:hover{background:var(--surface2);color:var(--brand);transform:rotate(90deg)}
.sl-empty{text-align:center;padding:56px 16px;color:var(--muted);font-size:13px;line-height:2}
.sl-empty .orb{width:96px;height:96px;margin:0 auto 20px;border-radius:32px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 20px 48px rgba(91,108,249,.32);animation:floaty 5s ease-in-out infinite}
.sl-foot{display:flex;align-items:center;gap:10px;margin-top:26px;color:var(--muted);font-size:11.5px;flex-wrap:wrap}
.sl-foot .grow{flex:1}
/* 底部标签栏 */
.shelf-tabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:14px;
  color:var(--muted);font-size:10.5px;font-weight:600;transition:.3s var(--ease);position:relative}
.st:hover{color:var(--text2)}
.st.on{color:var(--brand)}
.st.on::before{content:"";position:absolute;top:-7px;width:20px;height:3px;border-radius:9px;background:var(--brand);animation:fade .3s both}
.st.on svg{transform:translateY(-2px)}
.st svg{transition:transform .3s var(--ease)}
@media(max-width:900px){
  body.tabbed .topbar{display:none}
  body.on-shelf #view-shelf .wrap{padding:20px 14px 92px}
  body.on-shelf .fab.shelf-fab{bottom:78px}
  body.tabbed .shelf-tabs{display:flex}
  body.tabbed .toast-stack{bottom:84px}
  body.tabbed .view.on .wrap{padding-bottom:102px}
  .sl-head h1{font-size:23px}
  .sl-head{margin-bottom:16px}
  .sl-f{flex:none;max-width:none}
  .sl-f button{padding:8px 13px;white-space:nowrap}
  .mini-cover{width:66px;height:92px;border-radius:11px}
  .mini-cover::before{left:11px;top:30px;width:13px;height:13px}
  .sl-item{padding:13px 13px;gap:13px;border-radius:20px}
  .sl-info h3{font-size:15.5px}
  .sl-info .last{font-size:11px}
  .sl-more{align-self:center}
  body.editing .shelf-tabs{display:none}
}
@media(max-width:520px){
  .sl-head .acts .iconbtn{width:34px;height:34px}
  .sl-info .meta{font-size:11.5px;gap:7px}
  .sl-info .last time{font-size:10.5px}
  .sl-prog{max-width:170px}
}

/* ============ 横线稿纸写作模式 ============ */
.editor-col.ruled{background:var(--bg)}
.editor-col.ruled .editor-top,
.editor-col.ruled .toolrow,
.editor-col.ruled .paper-foot,
.editor-col.ruled .statusbar{display:none}
.rd-tools{flex:none;display:flex;align-items:center;justify-content:space-between;gap:3px;
  padding:10px 14px 6px}
.rd-tools button{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--text2);
  transition:.28s var(--ease);flex:none}
.rd-tools button:hover{color:var(--brand);background:var(--surface2);transform:translateY(-2px)}
.rd-tools button.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 11%,var(--surface))}
.rd-tools .sp{flex:1}
.rd-status{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding:2px 20px 8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rd-status .l{text-align:left}
.rd-status .r{text-align:right}
.rd-status .mid{color:var(--text2);font-weight:600;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-status b{color:var(--text2);font-weight:600}
.rd-title-wrap{flex:none;padding:10px 26px 16px;text-align:center;position:relative}
.rd-title{width:100%;border:0;background:transparent;outline:none;text-align:center;color:var(--text);
  font-family:var(--edit-font);font-size:23px;font-weight:700;letter-spacing:.06em;padding:6px 0}
.rd-title::placeholder{color:var(--muted)}
.rd-title-line{width:100%;height:1px;margin-top:12px;
  background:linear-gradient(90deg,transparent,var(--line) 12%,color-mix(in srgb,var(--brand) 45%,var(--line)) 50%,var(--line) 88%,transparent)}
.editor-col.ruled .paper-scroll{padding:0 18px 8px;align-items:stretch}
.editor-col.ruled .paper{max-width:100%;background:transparent;box-shadow:none;border:0;border-radius:0;
  padding:0;animation:none;display:flex;flex-direction:column;min-height:0;position:relative}
.editor-col.ruled .paper::before{display:none}
.editor-col.ruled .paper::after{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 35%,transparent) 18%,transparent 60%);opacity:.5}
.editor-col.ruled #editorText{
  flex:1;height:auto;min-height:0;font-size:var(--edit-size);line-height:var(--rule-h,39px);padding:0 0 0 4px;
  background-image:repeating-linear-gradient(to bottom,
    transparent 0,transparent calc(var(--rule-h,39px) - 1px),
    var(--rule-line) calc(var(--rule-h,39px) - 1px),var(--rule-line) var(--rule-h,39px));
  background-attachment:local;background-position:0 0;caret-color:var(--brand)}
.editor-col.ruled #editorText::placeholder{color:var(--muted);opacity:.75}
.rd-bar{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);position:relative;z-index:5}
.rd-puncts{flex:1;min-width:0;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.rd-puncts::-webkit-scrollbar{display:none}
.rd-key{flex:none;min-width:34px;height:36px;padding:0 9px;border-radius:11px;display:grid;place-items:center;
  color:var(--text2);font-size:15px;background:var(--surface3);border:1px solid var(--line);
  transition:.22s var(--ease);position:relative;overflow:hidden}
.rd-key:hover{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 35%,var(--line));transform:translateY(-2px)}
.rd-key:active{transform:scale(.88)}
.rd-key svg{width:16px;height:16px}
.rd-sep{width:1px;height:22px;background:var(--line);flex:none;margin:0 2px}
.rd-act{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--text2);
  transition:.22s var(--ease)}
.rd-act:hover{color:var(--brand);background:var(--surface2)}
.rd-act:active{transform:scale(.88)}
.rd-act.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 11%,var(--surface))}
body.editing .rd-title-wrap{display:none}
body.editing .rd-status{padding-bottom:4px}
body.editing .rd-tools{padding-top:5px;padding-bottom:3px}
body.kb-open .rd-bar{padding-bottom:8px}
/* 专注模式不破坏稿纸 */
body.focus .editor-col.ruled .paper{max-width:100%;padding:0}
body.focus .editor-col.ruled .paper-scroll{padding:0 18px 8px}
body.focus .editor-col.ruled #editorText{min-height:0;flex:1}
body.focus .editor-col.ruled .rd-tools,body.focus .editor-col.ruled .rd-status{opacity:1}
@media(max-width:900px){
  .editor-col.ruled .paper-scroll{padding:0 12px 6px}
  .editor-col.ruled .paper::after{display:none}
  .rd-tools{padding:8px 8px 4px;gap:0}
  .rd-tools button{width:34px;height:34px}
  .rd-status{padding:0 14px 6px;font-size:11px}
  .rd-title-wrap{padding:8px 18px 14px}
  .rd-title{font-size:21px}
  .editor-col.ruled #editorText{padding-left:2px}
  body.focus .editor-col.ruled .paper-scroll{padding:0 12px 6px}
}
@media(max-width:520px){
  .rd-key{min-width:32px;padding:0 7px;font-size:14px}
  .rd-act{width:33px;height:33px}

}
/* ============ 第一批 · 调墨盘（底部创作台） ============ */
.ink-mask{position:fixed;inset:0;z-index:92;background:rgba(8,11,22,.20);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
.ink-dock{width:100%;max-width:720px;background:var(--surface);
  border:1px solid var(--line);border-bottom:0;
  border-radius:30px 30px 0 0;box-shadow:0 -20px 70px rgba(0,0,0,.42);
  height:56vh;display:flex;flex-direction:column;overflow:hidden;
  animation:inkRise .48s var(--ease) both;transition:height .45s var(--ease)}
.ink-dock.full{height:calc(var(--app-h,100vh) - 86px)}
@keyframes inkRise{from{transform:translateY(100%);opacity:.4}to{transform:none;opacity:1}}
.ink-handle{flex:none;height:26px;display:grid;place-items:center;cursor:pointer;position:relative;
  background:var(--surface);border-radius:30px 30px 0 0}
.ink-handle i{width:42px;height:4px;border-radius:99px;background:var(--muted);opacity:.55;transition:.3s}
.ink-handle:hover i{opacity:1;width:56px;background:var(--brand)}
.ink-handle .hint{position:absolute;right:16px;top:5px;font-size:10px;color:var(--muted)}
.ink-preview{flex:none;display:flex;align-items:center;gap:12px;margin:0 16px 12px;padding:13px 16px;
  border-radius:18px;background:var(--surface3);border:1px solid var(--line);overflow:hidden}
.ink-preview .lab{font-size:9.5px;letter-spacing:.16em;color:var(--muted);writing-mode:vertical-rl;flex:none;opacity:.8}
.ink-preview .sample{flex:1;min-width:0;font-family:var(--edit-font);font-size:var(--edit-size);
  font-weight:var(--ink-weight,400);color:var(--ink-text,var(--text));text-shadow:var(--ink-shadow,none);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.9}
.ink-preview .tag{font-size:9.5px;color:var(--muted);flex:none;text-align:right;line-height:1.5}
.ink-tabs{flex:none;display:flex;gap:4px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.ink-tabs::-webkit-scrollbar{display:none}
.ink-tab{flex:1;min-width:54px;padding:9px 4px;border-radius:13px;font-size:11.5px;font-weight:600;
  color:var(--muted);position:relative;transition:.3s var(--ease);white-space:nowrap}
.ink-tab:hover{color:var(--text2);background:var(--surface2)}
.ink-tab.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.ink-tab.on::after{content:"";position:absolute;left:32%;right:32%;bottom:3px;height:2.5px;
  border-radius:9px;background:var(--brand);animation:fade .3s both}
.ink-body{flex:1;min-height:0;overflow:auto;padding:2px 16px 28px;scrollbar-width:thin}
.ink-sec{margin:16px 0 9px;font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:700;
  display:flex;align-items:center;gap:8px}
.ink-sec::after{content:"";flex:1;height:1px;background:var(--line)}
.ink-sec .tip{font-size:9.5px;letter-spacing:0;font-weight:400;opacity:.8}
.ink-card{background:var(--surface3);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:9px}
.ink-card.tight{padding:10px 12px}
.ink-line{display:flex;align-items:center;gap:10px;min-height:38px}
.ink-line+.ink-line{border-top:1px solid var(--line)}
.ink-line .lb{flex:1;min-width:0;font-size:12.5px}
.ink-line .lb small{display:block;font-size:10px;color:var(--muted);margin-top:3px;line-height:1.5}
.ink-line .val{font-size:12px;color:var(--brand);font-weight:700;font-variant-numeric:tabular-nums}
.ink-toggle{flex:none;width:42px;height:24px;border-radius:99px;background:var(--surface2);
  border:1px solid var(--line);position:relative;transition:.3s var(--ease)}
.ink-toggle::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;
  background:var(--muted);transition:.3s var(--ease)}
.ink-toggle.on{background:var(--brand);border-color:var(--brand)}
.ink-toggle.on::after{transform:translateX(18px);background:#fff}
.ink-seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:14px}
.ink-seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:11.5px;color:var(--muted);
  transition:.28s var(--ease);white-space:nowrap}
.ink-seg button:hover{color:var(--text2)}
.ink-seg button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow2);font-weight:700}
.ink-sw-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.ink-sw{width:30px;height:30px;border-radius:11px;position:relative;border:1px solid var(--line);
  transition:.28s var(--ease);flex:none}
.ink-sw:hover{transform:translateY(-3px) scale(1.06)}
.ink-sw.on{box-shadow:0 0 0 2px var(--surface3),0 0 0 4px var(--brand)}
.ink-sw.reset{display:grid;place-items:center;color:var(--muted);background:var(--surface2);font-size:10px}
.ink-sw.reset:hover{color:var(--brand)}
.ink-stepper{display:flex;align-items:center;gap:4px;flex:none}
.ink-stepper button{width:30px;height:30px;border-radius:10px;background:var(--surface2);
  color:var(--text2);font-size:16px;display:grid;place-items:center;transition:.25s}
.ink-stepper button:hover{background:var(--brand);color:#fff}
.ink-stepper b{min-width:34px;text-align:center;font-size:14px;color:var(--brand);font-variant-numeric:tabular-nums}
.ink-range{flex:1;width:100%;accent-color:var(--brand);height:26px}
.ink-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.ink-preset{border-radius:16px;padding:9px;border:1.5px solid var(--line);background:var(--surface2);
  transition:.32s var(--ease);text-align:left;overflow:hidden;position:relative}
.ink-preset:hover{transform:translateY(-4px);box-shadow:var(--shadow2)}
.ink-preset.on{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 13%,transparent)}
.ink-preset .thumb{height:48px;border-radius:10px;margin-bottom:8px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.ink-preset .thumb span{font-size:11px;font-weight:700;letter-spacing:.08em;z-index:2}
.ink-preset .thumb i{position:absolute;left:8px;right:8px;height:1px;opacity:.5}
.ink-preset .thumb i:nth-child(2){top:20px}.ink-preset .thumb i:nth-child(3){top:32px}
.ink-preset .nm{font-size:11.5px;font-weight:700;display:block}
.ink-preset .ds{font-size:9.5px;color:var(--muted);display:block;margin-top:2px}
.ink-chips{display:flex;gap:7px;flex-wrap:wrap}
.ink-chip{padding:8px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);
  font-size:12px;color:var(--text2);transition:.25s var(--ease);position:relative}
.ink-chip:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-2px)}
.ink-chip.on{background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand);border-color:var(--brand)}
.ink-chip .x{margin-left:7px;opacity:.5;font-size:13px}
.ink-chip .x:hover{opacity:1;color:#EF6A6A}
.ink-add{display:flex;gap:8px;margin-top:10px}
.ink-add input{flex:1;min-width:0;height:36px;border:1px solid var(--line);background:var(--surface2);
  border-radius:12px;padding:0 12px;outline:none;font-size:12px;color:var(--text)}
.ink-add input:focus{border-color:var(--brand)}
.ink-soon{border:1px dashed var(--line);border-radius:16px;padding:14px;font-size:11px;
  color:var(--muted);line-height:1.8;display:flex;gap:10px;align-items:flex-start}
.ink-soon b{color:var(--text2);display:block;font-size:11.5px;margin-bottom:3px}
.ink-foot{flex:none;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--muted)}
.ink-foot .grow{flex:1}
body.ink-open .rd-bar{opacity:.16;filter:blur(1px);pointer-events:none;transition:opacity .3s}
body.ink-open .quick-scroll,body.ink-open .quickbar{opacity:0;pointer-events:none;transition:opacity .3s}

/* 稿纸：自定义变量生效 */
.editor-col.ruled{background-color:var(--ink-paper,var(--bg));
  background-image:var(--ink-texture,none);background-size:var(--ink-tex-size,auto)}
.editor-col.ruled .rd-tools,.editor-col.ruled .rd-status,
.editor-col.ruled .rd-title-wrap,.editor-col.ruled .rd-bar{background:transparent}
.editor-col.ruled #editorText{color:var(--ink-text,var(--text));
  font-weight:var(--ink-weight,400);text-shadow:var(--ink-shadow,none);
  background-image:repeating-linear-gradient(to bottom,
    transparent 0,transparent calc(var(--rule-h,39px) - 1px),
    var(--ink-rule,var(--rule-line)) calc(var(--rule-h,39px) - 1px),var(--ink-rule,var(--rule-line)) var(--rule-h,39px));
  caret-color:var(--ink-caret,var(--brand))}
.editor-col.ruled .rd-title{font-size:calc(var(--edit-size) * var(--ink-title-scale,1.2));
  color:var(--ink-text,var(--text))}
.editor-col.ruled .paper-scroll{position:relative}
.editor-col.ruled .paper{position:relative}
.line-glow{position:absolute;left:0;right:0;z-index:2;pointer-events:none;border-radius:10px;
  background:linear-gradient(90deg,transparent,var(--ink-glow,rgba(124,139,255,.075)) 12%,
    var(--ink-glow,rgba(124,139,255,.075)) 88%,transparent);
  opacity:0;transition:opacity .3s,top .12s linear;mix-blend-mode:screen}
body.breathe-caret .editor-col.ruled #editorText{animation:inkCaret 2.6s ease-in-out infinite}
@keyframes inkCaret{0%,100%{caret-color:var(--ink-caret,var(--brand))}
  50%{caret-color:color-mix(in srgb,var(--ink-caret,var(--brand)) 35%,transparent)}}
body.hide-rd-tools .rd-tools,body.hide-rd-status .rd-status,
body.hide-rd-title .rd-title-wrap{display:none}
.quick-scroll{position:absolute;right:14px;bottom:14px;z-index:7;display:flex;flex-direction:column;gap:8px}
.quick-scroll button{width:38px;height:38px;border-radius:14px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(12px);border:1px solid var(--line);color:var(--text2);display:grid;place-items:center;
  box-shadow:var(--shadow2);transition:.3s var(--ease)}
.quick-scroll button:hover{color:var(--brand);transform:translateY(-3px)}

/* 墨令 · 行内指令 */
.mo-ling{position:absolute;left:0;right:0;bottom:100%;z-index:12;display:none;
  padding:9px 10px;background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(20px);border-top:1px solid var(--line);
  box-shadow:0 -12px 32px rgba(0,0,0,.22)}
.mo-ling.on{display:block;animation:up .28s var(--ease) both}
.mo-head{font-size:9.5px;letter-spacing:.14em;color:var(--muted);padding:0 4px 8px;
  display:flex;align-items:center;gap:7px}
.mo-head .grow{flex:1}
.mo-items{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.mo-items::-webkit-scrollbar{display:none}
.mo-item{flex:none;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:13px;
  background:var(--surface3);border:1px solid var(--line);font-size:12px;color:var(--text2);
  transition:.25s var(--ease)}
.mo-item:hover,.mo-item.sel{color:var(--brand);border-color:var(--brand);
  background:color-mix(in srgb,var(--brand) 10%,var(--surface));transform:translateY(-2px)}
.mo-item b{font-weight:700}
.mo-item small{font-size:9.5px;color:var(--muted)}

/* 速令台 · 手机端网格抽屉 */
@media(max-width:900px){
  .cmd-mask{align-items:flex-end;padding:0;background:rgba(10,13,26,.28);backdrop-filter:blur(2px)}
  .cmd{max-width:none;border-radius:28px 28px 0 0;border-bottom:0;max-height:84vh;
    animation:inkRise .42s var(--ease) both}
  .cmd-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start;padding:10px}
  .cmd-group{grid-column:1/-1;padding:11px 4px 3px}

    justify-content:center;border:1px solid var(--line);background:var(--surface3)}
  .cmd-item .ci{width:26px;height:26px;border-radius:9px}
  .cmd-item .ct b{font-size:11.5px;line-height:1.35}
  .cmd-item small,.cmd-item kbd{display:none}

}

}

/* 稿纸模式下侧栏不常驻，改为按需滑出的浮层 */

body.ruled-view .side{left:0;border-right:1px solid var(--line)}

body.ruled-view .overlay{position:fixed;inset:74px 0 0;background:rgba(20,24,45,.42);z-index:44;animation:fade .25s both}
/* 手机端稿纸页：只留一行工具条，彻底沉浸 */
@media(max-width:900px){
  body.on-write.ruled-view .topbar{display:none}
  body.on-write.ruled-view .rd-tools{padding-top:calc(10px + env(safe-area-inset-top))}
  body.on-write.ruled-view .side,body.on-write.ruled-view .inspector{top:0}
  body.on-write.ruled-view .overlay{inset:0}
